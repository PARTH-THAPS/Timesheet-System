<?xml version="1.0" encoding="UTF-8"?>
<ui:composition template="/WEB-INF/templates/page-layout.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:ui="jakarta.faces.facelets"
                 xmlns:h="jakarta.faces.html"
                 xmlns:f="jakarta.faces.core"
                 xmlns:p="http://primefaces.org/ui">
    <ui:param name="pageHeadline" value="Holidays"/>
    <ui:define name="title">Holiday List</ui:define>
    <ui:define name="content">
        <h:form id="holidayForm">
            <h:messages globalOnly="true" />
            <p:dataTable id="holidayTable"
                         var="holiday"
                         value="#{HolidayListBean.holiday}"
                         emptyMessage="No holidays found."
                         paginator="true"
                         rows="10">
                <p:column headerText="Holiday">
                    <h:outputText value="#{holiday.holiday}" />
                </p:column>
                <p:column headerText="State">
                    <h:outputText value="#{holiday.state}" />
                </p:column>
                <p:column headerText="Year">
                    <h:outputText value="#{holiday.year}" />
                </p:column>
                <p:column headerText="Date">
                    <h:outputText value="#{holiday.date}">
                        <f:convertDateTime type="localDate" pattern="dd.MM.yyyy" />
                    </h:outputText>
                </p:column>
                <p:column headerText="Day">
                    <h:outputText value="#{holiday.day}" />
                </p:column>
                <p:column headerText="Actions">
                    <h:link outcome="HolidayEdit" value="Edit">
                        <f:param name="id" value="#{holiday.uuid}" />
                    </h:link>
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
