<?xml version="1.0" encoding="UTF-8"?>

<ui:composition
    template="/WEB-INF/templates/page-layout.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets">

    <ui:define name="pageTitle">
        #{msg['personalInfo.title']}
    </ui:define>

    <ui:define name="pageHeadline">
        #{msg['personalInfo.title']}
    </ui:define>

    <ui:define name="navigation">
        <ui:include src="/WEB-INF/components/navigation.xhtml"/>
    </ui:define>


    <ui:define name="headerActions">
        <div class="user-info">
            <span class="user-name">
                #{loginBean.user.firstName} #{loginBean.user.lastName}
            </span>
            <ui:repeat
                value="#{loginBean.user.roles}"
                var="role">
                <span class="badge">
                    #{msg['role.'.concat(role.name())]}
                </span>
            </ui:repeat>
        </div>
    </ui:define>

    <ui:define name="content">
        <h:form id="personalInfoForm">
            <h:messages infoStyle="color:green;" errorStyle="color:red;"/>

            <h:outputText value="#{personalDataBean.user}" style="display:none;"/>

            <h:panelGrid columns="3">
                <h:outputLabel for="firstName" value="#{msg['person.firstName']}:"/>
                <h:inputText id="firstName"
                             value="#{personalDataBean.personDTO.firstName}"
                             required="true"
                             requiredMessage="#{msg['personalInfo.firstName.required']}"/>
                <h:message for="firstName" style="color:red;"/>

                <h:outputLabel for="lastName" value="#{msg['person.lastName']}:"/>
                <h:inputText id="lastName"
                             value="#{personalDataBean.personDTO.lastName}"
                             required="true"
                             requiredMessage="#{msg['personalInfo.lastName.required']}"/>
                <h:message for="lastName" style="color:red;"/>

                <h:outputLabel for="email" value="#{msg['person.email']}:"/>
                <h:inputText id="email"
                             value="#{personalDataBean.personDTO.emailAddress}"
                             required="true"
                             requiredMessage="#{msg['personalInfo.email.required']}" readonly="true"/>
                <h:message for="email" style="color:red;"/>

                <h:outputLabel for="preferredLanguage"
                               value="#{msg['personalInfo.PreferedLanguage.ForReminder']}:"/>
                <h:selectOneMenu id="preferredLanguage"
                                 value="#{personalDataBean.personDTO.preferredLanguage}"
                                 required="true"
                                 requiredMessage="#{msg['personalInfo.preferredLanguage.required']}">
                    <f:selectItem itemLabel="#{msg['select.pleaseChoose']}"
                                  itemValue="#{null}"
                                  noSelectionOption="true"/>
                    <f:selectItems value="#{personalDataBean.languages}"
                                   var="l"
                                   itemValue="#{l}"
                                   itemLabel="#{msg['language.'.concat(l.name())]}"/>
                </h:selectOneMenu>
                <h:message for="preferredLanguage" style="color:red;"/>
            </h:panelGrid>

            <br/>
            <h:commandButton value="#{msg['button.save']}" action="#{personalDataBean.save}"/>
        </h:form>
    </ui:define>


</ui:composition>
