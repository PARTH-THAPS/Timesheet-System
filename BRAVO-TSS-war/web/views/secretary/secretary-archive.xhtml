<?xml version="1.0" encoding="UTF-8"?>
<ui:composition
        template="/WEB-INF/templates/page-layout.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="jakarta.faces.html"
        xmlns:f="jakarta.faces.core"
        xmlns:ui="jakarta.faces.facelets"
        xmlns:p="http://primefaces.org/ui">

    <ui:define name="pageTitle">Pending Archives</ui:define>
    <ui:define name="pageHeadline">Pending Archives</ui:define>

    <ui:define name="navigation">
        <ui:include src="/WEB-INF/components/navigation.xhtml"/>
    </ui:define>

    <ui:define name="content">
        <section class="page-section-header">
            <div>
                <h2>Ready for Archiving</h2>
                <p class="text-muted">Timesheets signed by supervisors waiting to be archived.</p>
            </div>
        </section>

        <section class="card">
            <h:form id="secretaryArchiveForm">
                <p:dataTable
                        id="pendingArchivesTable"
                        value="#{secretaryArchivesBean.timesheetList}"
                        var="timesheet"
                        paginator="true"
                        rows="10"
                        stripedRows="true"
                        emptyMessage="No timesheets are currently waiting to be archived.">

                    <p:column headerText="Start Date" sortBy="#{timesheet.startDate}">
                        <h:outputText value="#{timesheet.startDate}">
                            <f:convertDateTime type="localDate" pattern="dd.MM.yyyy"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="End Date" sortBy="#{timesheet.endDate}">
                        <h:outputText value="#{timesheet.endDate}">
                            <f:convertDateTime type="localDate" pattern="dd.MM.yyyy"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Status">
                        <span class="status-badge">#{timesheet.status}</span>
                    </p:column>

                    <p:column headerText="Actions" styleClass="table-actions-column">
                        <p:commandButton
                                value="Archive"
                                icon="pi pi-box"
                                action="#{secretaryArchivesBean.archiveTimesheet(timesheet.id)}"
                                update="pendingArchivesTable"
                                styleClass="ui-button-success" />
                    </p:column>
                </p:dataTable>
            </h:form>
        </section>
    </ui:define>
</ui:composition>
