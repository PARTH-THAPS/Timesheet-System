<?xml version="1.0" encoding="UTF-8"?>

<ui:composition
    template="/WEB-INF/templates/page-layout.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="http://primefaces.org/ui">

    <ui:define name="pageTitle">
        #{msg['archive.title']}
    </ui:define>

    <ui:define name="pageHeadline">
        #{msg['archive.title']}
    </ui:define>

    <ui:define name="navigation">
        <ui:include src="/WEB-INF/components/navigation.xhtml"/>
    </ui:define>

    <ui:define name="headerActions">
        <ui:include src="/WEB-INF/components/header-actions.xhtml" />
    </ui:define>

    <ui:define name="content">

        <section class="page-section-header">

            <div>

                <h2>
                    #{msg['archive.ready']}
                </h2>

                <p class="text-muted">
                    #{msg['archive.description']}
                </p>

            </div>

        </section>

        <section class="card">

            <h:form id="secretaryArchiveForm">

                <p:dataTable
                    id="pendingArchivesTable"
                    value="#{secretaryArchivesBean.timesheetList}"
                    var="timesheet"
                    paginator="true"
                    rows="10"
                    stripedRows="true"
                    emptyMessage="#{msg['archive.noTimesheets']}">

                    <p:column
                        headerText="#{msg['timesheet.startDate']}"
                        sortBy="#{timesheet.startDate}">

                        <h:outputText value="#{timesheet.startDate}">
                            <f:convertDateTime
                                type="localDate"
                                pattern="dd.MM.yyyy"/>
                        </h:outputText>

                    </p:column>

                    <p:column
                        headerText="#{msg['timesheet.endDate']}"
                        sortBy="#{timesheet.endDate}">

                        <h:outputText value="#{timesheet.endDate}">
                            <f:convertDateTime
                                type="localDate"
                                pattern="dd.MM.yyyy"/>
                        </h:outputText>

                    </p:column>

                    <p:column
                        headerText="#{msg['timesheet.approvalStatus']}">

                        <span class="status-badge">
                            #{msg['timesheet.status.'.concat(timesheet.status)]}
                        </span>

                    </p:column>

                    <p:column
                        headerText="#{msg['common.actions']}"
                        styleClass="table-actions-column">

                        <p:commandButton
                            value="#{msg['archive.archive']}"
                            icon="pi pi-box"
                            action="#{secretaryArchivesBean.archiveTimesheet(timesheet.id)}"
                            update="pendingArchivesTable"
                            styleClass="ui-button-success">

                            <p:confirm
                                header="#{msg['archive.confirm.title']}"
                                message="#{msg['archive.confirm.message']}"
                                icon="pi pi-exclamation-triangle"/>

                        </p:commandButton>

                    </p:column>

                </p:dataTable>

            </h:form>

            <p:confirmDialog global="true">

                <p:commandButton
                    value="#{msg['button.yes']}"
                    type="button"
                    styleClass="ui-confirmdialog-yes"
                    icon="pi pi-check"/>

                <p:commandButton
                    value="#{msg['button.no']}"
                    type="button"
                    styleClass="ui-confirmdialog-no ui-button-secondary"
                    icon="pi pi-times"/>

            </p:confirmDialog>

        </section>

    </ui:define>

</ui:composition>
