<?xml version="1.0" encoding="UTF-8"?>

<ui:composition
    template="/WEB-INF/templates/page-layout.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="http://primefaces.org/ui">

    <ui:define name="pageTitle">
        #{msg['timesheet.secretary.title']}
    </ui:define>

    <ui:define name="pageHeadline">
        #{msg['timesheet.secretary.title']}
    </ui:define>

    <ui:define name="navigation">
        <ui:include src="/WEB-INF/components/navigation.xhtml"/>
    </ui:define>

    <ui:define name="headerActions">
        <ui:include src="/WEB-INF/components/header-actions.xhtml"/>
    </ui:define>

    <ui:define name="content">

        <h:form id="secretaryTimesheetsForm">

            <p:messages
                id="messages"
                showDetail="true"
                closable="true"
                styleClass="app-messages"/>

            <section class="page-section-header">
                <div>
                    <p class="text-muted">
                        #{msg['timesheet.secretary.description']}
                    </p>
                </div>
            </section>

            <section class="card">

                <p:dataTable
                    id="secretaryTimesheets"
                    widgetVar="secretaryTimesheetsTable"
                    value="#{secretaryTimesheetsBean.timesheetList}"
                    var="timesheet"
                    paginator="true"
                    rows="10"
                    stripedRows="true"
                    emptyMessage="#{msg['timesheet.noAssigned']}"
                    sortMode="single">

                    <p:column
                        headerText="#{msg['timesheet.employee']}"
                        sortBy="#{timesheet.employeeFullName}"
                        filterBy="#{timesheet.employeeFullName}"
                        filterMatchMode="contains">

                        <h:outputText value="#{timesheet.employeeFullName}"/>

                    </p:column>

                    <p:column
                        headerText="#{msg['timesheet.period']}"
                        sortBy="#{timesheet.startDate}">

                        <h:outputText value="#{timesheet.startDate}">
                            <f:convertDateTime
                                type="localDate"
                                pattern="dd.MM.yyyy"/>
                        </h:outputText>

                        –

                        <h:outputText value="#{timesheet.endDate}">
                            <f:convertDateTime
                                type="localDate"
                                pattern="dd.MM.yyyy"/>
                        </h:outputText>

                    </p:column>

                    <p:column
                        headerText="#{msg['timesheet.status']}"
                        sortBy="#{timesheet.status}"
                        filterBy="#{timesheet.status}"
                        filterMatchMode="exact">

                        <f:facet name="filter">

                            <p:selectOneMenu
                                onchange="PF('secretaryTimesheetsTable').filter()">

                                <f:selectItem
                                    itemLabel="#{msg['common.all']}"
                                    itemValue="#{null}"
                                    noSelectionOption="true"/>

                                <f:selectItems
                                    value="#{secretaryTimesheetsBean.statuses}"
                                    var="status"
                                    itemLabel="#{msg['timesheet.status.'.concat(status)]}"
                                    itemValue="#{status}"/>

                            </p:selectOneMenu>

                        </f:facet>

                        <span class="status-badge status-#{timesheet.status}">
                            #{msg['timesheet.status.'.concat(timesheet.status)]}
                        </span>

                    </p:column>

                    <p:column
                        headerText="#{msg['timesheet.hoursDue']}"
                        sortBy="#{timesheet.hoursDue}">

                        <h:outputText value="#{timesheet.hoursDue}">
                            <f:convertNumber
                                minFractionDigits="2"
                                maxFractionDigits="2"/>
                        </h:outputText>

                        #{msg['timesheet.hoursUnit']}

                    </p:column>

                    <p:column
                        headerText="#{msg['common.actions']}"
                        styleClass="table-actions-column">

                        <p:button
                            value="#{msg['timesheet.open']}"
                            icon="pi pi-folder-open"
                            outcome="/views/secretary/timesheet"
                            styleClass="ui-button-secondary">

                            <f:param
                                name="id"
                                value="#{timesheet.id}"/>

                        </p:button>

                        <p:button
                            value="#{msg['button.print']}"
                            icon="pi pi-print"
                            outcome="/views/secretary/print/timesheet"
                            styleClass="ui-button-secondary">

                            <f:param
                                name="id"
                                value="#{timesheet.id}"/>

                        </p:button>

                    </p:column>

                </p:dataTable>

            </section>

        </h:form>

    </ui:define>

</ui:composition>
