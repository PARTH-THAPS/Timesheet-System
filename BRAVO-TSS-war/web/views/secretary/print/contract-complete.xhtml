<?xml version="1.0" encoding="UTF-8"?>

<ui:composition
    template="/WEB-INF/templates/page-layout.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="http://primefaces.org/ui">

    <ui:define name="metadata">
        <f:event
            type="preRenderView"
            listener="#{contractPrintBean.loadContract}"/>
    </ui:define>

    <ui:define name="navigation">
        <ui:include src="/WEB-INF/components/navigation.xhtml"/>
    </ui:define>

    <ui:define name="headerActions">
        <ui:include src="/WEB-INF/components/header-actions.xhtml"/>
    </ui:define>

    <ui:define name="content">

        <ui:fragment rendered="#{not empty contractPrintBean.contract}">

            <div class="print-actions">

                <p:commandButton
                    value="#{msg['contract.print.complete']}"
                    icon="pi pi-print"
                    onclick="window.print();"
                    type="button"
                    styleClass="ui-button-secondary"/>

            </div>

            <ui:include src="/WEB-INF/components/print/contract-cover.xhtml">

                <ui:param
                    name="printBean"
                    value="#{contractPrintBean}"/>

            </ui:include>

            <ui:repeat
                value="#{contractPrintBean.timesheets}"
                var="timesheet">
                
                <div class="print-page-break"></div>

                <ui:include src="/WEB-INF/components/print/timesheet-page.xhtml">

                    <ui:param
                        name="timesheet"
                        value="#{timesheet}"/>

                    <ui:param
                        name="reportedHours"
                        value="#{contractPrintBean.getReportedHours(timesheet)}"/>

                </ui:include>

            </ui:repeat>

        </ui:fragment>

    </ui:define>

</ui:composition>
