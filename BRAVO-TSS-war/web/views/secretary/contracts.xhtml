<?xml version="1.0" encoding="UTF-8"?>

<ui:composition
    template="/WEB-INF/templates/page-layout.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="http://primefaces.org/ui">

    <ui:define name="pageTitle">
        #{msg['contracts.title']}
    </ui:define>

    <ui:define name="pageHeadline">
        #{msg['contracts.title']}
    </ui:define>

    <ui:define name="navigation">
        <ui:include src="/WEB-INF/components/navigation.xhtml"/>
    </ui:define>

    <ui:define name="headerActions">
        <ui:include src="/WEB-INF/components/header-actions.xhtml" />
    </ui:define>

    <ui:define name="content">

        <section class="page-section-header">
            <div>
                <h2>#{msg['contracts.title']}</h2>
                <p class="text-muted">
                    #{msg['contracts.secretaryDescription']}
                </p>
            </div>
        </section>

        <section class="card">

            <h:form id="secretaryContractsForm">

                <p:dataTable
                    id="secretaryContractsTable"
                    widgetVar="secretaryContractsTable"
                    value="#{secretaryContractBean.contracts}"
                    var="contract"
                    paginator="true"
                    rows="10"
                    stripedRows="true"
                    sortMode="single"
                    emptyMessage="#{msg['contracts.noContracts']}">

                    <p:column
                        headerText="#{msg['contract.name']}"
                        sortBy="#{contract.name}"
                        filterBy="#{contract.name}"
                        filterMatchMode="contains">

                        <h:outputText value="#{contract.name}"/>

                    </p:column>

                    <p:column
                        headerText="#{msg['contracts.period']}"
                        sortBy="#{contract.startDate}">

                        <h:outputText value="#{contract.startDate}">
                            <f:convertDateTime
                                type="localDate"
                                pattern="dd.MM.yyyy"/>
                        </h:outputText>

                        <span class="timesheet-period-separator">
                            &#8211;
                        </span>

                        <h:outputText value="#{contract.endDate}">
                            <f:convertDateTime
                                type="localDate"
                                pattern="dd.MM.yyyy"/>
                        </h:outputText>

                    </p:column>

                    <p:column
                        headerText="#{msg['contract.status']}"
                        sortBy="#{contract.status}"
                        filterBy="#{contract.status}"
                        filterMatchMode="exact">

                        <f:facet name="filter">

                            <p:selectOneMenu
                                onchange="PF('secretaryContractsTable').filter()">

                                <f:selectItem
                                    itemLabel="#{msg['common.all']}"
                                    itemValue="#{null}"
                                    noSelectionOption="true"/>

                                <f:selectItems
                                    value="#{secretaryContractBean.statuses}"
                                    var="status"
                                    itemValue="#{status}"
                                    itemLabel="#{msg['contract.status.'.concat(status)]}"/>

                            </p:selectOneMenu>

                        </f:facet>

                        <span class="status-badge status-#{contract.status}">
                            #{msg['contract.status.'.concat(contract.status)]}
                        </span>

                    </p:column>

                    <p:column
                        headerText="#{msg['contract.archiveDuration']}"
                        sortBy="#{contract.archiveDuration}"
                        styleClass="table-small-column">

                        <h:outputText value="#{contract.archiveDuration}"/>
                        <span>
                            #{msg['contract.archiveDuration.years']}
                        </span>

                    </p:column>

                    <p:column
                        headerText="#{msg['common.actions']}"
                        styleClass="table-actions-column">

                        <p:button
                            icon="pi pi-print"
                            value="#{msg['contract.print.button']}"
                            title="#{msg['contract.print.button']}"
                            outcome="/views/secretary/print/contract-cover"
                            target="_blank"
                            styleClass="ui-button-secondary">

                            <f:param
                                name="id"
                                value="#{contract.id}"/>

                        </p:button>

                        <p:button
                            icon="pi pi-print"
                            value="#{msg['contract.print.complete']}"
                            title="#{msg['contract.print.complete']}"
                            outcome="/views/secretary/print/contract-complete"
                            target="_blank"
                            styleClass="ui-button-secondary">

                            <f:param
                                name="id"
                                value="#{contract.id}"/>

                        </p:button>

                        <p:commandButton
                            icon="pi pi-eye"
                            title="#{msg['contract.view']}"
                            process="@this"
                            update=":secretaryContractsForm:contractDetails"
                            oncomplete="PF('contractDetailsDialog').show()"
                            styleClass="ui-button-secondary">

                            <f:setPropertyActionListener
                                target="#{secretaryContractBean.selectedContract}"
                                value="#{contract}"/>

                        </p:commandButton>

                    </p:column>

                </p:dataTable>

                <p:dialog
                    id="contractDetails"
                    widgetVar="contractDetailsDialog"
                    modal="true"
                    responsive="true"
                    closable="true"
                    resizable="false">

                    <ui:include src="/WEB-INF/components/contract-statistics.xhtml">
                        <ui:param
                            name="statistics"
                            value="#{secretaryContractBean.selectedStatistics}"/>
                    </ui:include>

                </p:dialog>

            </h:form>

        </section>

    </ui:define>

</ui:composition>
