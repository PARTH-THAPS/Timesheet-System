<?xml version="1.0" encoding="UTF-8"?>

<ui:composition
        template="/WEB-INF/templates/page-layout.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="jakarta.faces.facelets"
        xmlns:h="jakarta.faces.html"
        xmlns:f="jakarta.faces.core"
        xmlns:p="http://primefaces.org/ui">

    <ui:define name="pageTitle">Holiday List</ui:define>

    <ui:define name="pageHeadline">Holidays</ui:define>

    <ui:define name="navigation">
        <ui:include src="/WEB-INF/components/navigation.xhtml"/>
    </ui:define>

    <ui:define name="content">

        <div class="list-actions">
            <h:link
                    outcome="/views/admin/HolidayEdit"
                    styleClass="ui-button ui-button-primary">
                <i class="pi pi-plus"></i>
                <span>Add Holiday</span>
            </h:link>
        </div>

        <h:form id="holidayForm">

            <h:messages globalOnly="true" />
            <div class="table-responsive-wrapper">
            <p:dataTable id="holidayTable"
                         var="holiday"
                         value="#{HolidayListBean.holiday}"
                         emptyMessage="No holidays found."
                         paginator="true"
                         paginatorAlwaysVisible="false"
                         style="width:100%"
                         rows="10">

                <p:column headerText="Holiday">
                    <h:outputText value="#{holiday.holiday}" />
                </p:column>

                <p:column headerText="State">
                    <h:outputText value="#{holiday.state}" />
                </p:column>

                <p:column headerText="Year">
                    <h:outputText value="#{holiday.year}" />
                </p:column>

                <p:column headerText="Date">
                    <h:outputText value="#{holiday.date}">
                        <f:convertDateTime type="localDate" pattern="dd.MM.yyyy" />
                    </h:outputText>
                </p:column>

                <p:column headerText="Day">
                    <h:outputText value="#{holiday.day}" />
                </p:column>

                <p:column headerText="Actions" styleClass="actions-column">

                    <h:link
                            outcome="/views/admin/HolidayEdit"
                            styleClass="ui-button ui-button-secondary action-btn">
                        <f:param name="id" value="#{holiday.id}" />
                        <i class="pi pi-pencil"></i>
                        <span>Edit</span>
                    </h:link>

                    <p:commandButton
                            value="Delete"
                            icon="pi pi-trash"
                            action="#{HolidayListBean.deleteHoliday(holiday)}"
                            ajax="false"
                            styleClass="ui-button-danger action-btn">

                        <p:confirm
                                header="Delete holiday"
                                message="Are you sure you want to delete this holiday?"
                                icon="pi pi-exclamation-triangle"/>

                    </p:commandButton>

                </p:column>

            </p:dataTable>
            </div>
            <p:confirmDialog global="true">

                <p:commandButton
                        value="Yes"
                        type="button"
                        styleClass="ui-confirmdialog-yes"
                        icon="pi pi-check"/>

                <p:commandButton
                        value="No"
                        type="button"
                        styleClass="ui-confirmdialog-no ui-button-secondary"
                        icon="pi pi-times"/>

            </p:confirmDialog>

        </h:form>

    </ui:define>

</ui:composition>
