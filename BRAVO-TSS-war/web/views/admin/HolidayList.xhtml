<ui:composition
        template="/WEB-INF/templates/page-layout.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="jakarta.faces.facelets"
        xmlns:h="jakarta.faces.html"
        xmlns:f="jakarta.faces.core"
        xmlns:p="http://primefaces.org/ui">

    <ui:define name="pageTitle">
        #{msg['holiday.list']}
    </ui:define>

    <ui:define name="pageHeadline">
        #{msg['holiday.list']}
    </ui:define>

    <ui:define name="navigation">
        <ui:include src="/WEB-INF/components/navigation.xhtml"/>
    </ui:define>
 
    
    <ui:define name="headerActions">
            <div class="user-info">
                <span class="user-name">
                    #{loginBean.user.firstName} #{loginBean.user.lastName}
                </span>
                <ui:repeat
                    value="#{loginBean.user.roles}"
                    var="role">
                    <span class="badge">
                        #{msg['role.'.concat(role.name())]}
                    </span>
                </ui:repeat>
            </div>
        </ui:define>
    
    <ui:define name="content">

        <div class="list-actions">
            <h:link
                    outcome="/views/admin/HolidayEdit"
                    styleClass="ui-button ui-button-primary">
                <i class="pi pi-plus"></i>
                <span>#{msg['holiday.add']}</span>
            </h:link>
        </div>

        <h:form id="holidayForm">

            <h:messages globalOnly="true"/>

            <div class="table-responsive-wrapper">

                <p:dataTable
                        id="holidayTable"
                        var="holiday"
                        value="#{HolidayListBean.holiday}"
                        emptyMessage="#{msg['holiday.noHolidays']}"
                        paginator="true"
                        paginatorAlwaysVisible="false"
                        style="width:100%"
                        rows="10">

                    <p:column headerText="#{msg['holiday.holiday']}">
                        <h:outputText value="#{holiday.holiday}"/>
                    </p:column>

                    <p:column headerText="#{msg['holiday.state']}">
                        <h:outputText value="#{holiday.state}"/>
                    </p:column>

                    <p:column headerText="#{msg['holiday.year']}">
                        <h:outputText value="#{holiday.year}"/>
                    </p:column>

                    <p:column headerText="#{msg['holiday.date']}">
                        <h:outputText value="#{holiday.date}">
                            <f:convertDateTime
                                    type="localDate"
                                    pattern="dd.MM.yyyy"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="#{msg['holiday.day']}">
                        <h:outputText value="#{holiday.day}"/>
                    </p:column>

                    <p:column
                            headerText="#{msg['common.actions']}"
                            styleClass="actions-column">

                        <h:link
                                outcome="/views/admin/HolidayEdit"
                                styleClass="ui-button ui-button-secondary action-btn">

                            <f:param
                                    name="id"
                                    value="#{holiday.id}"/>

                            <i class="pi pi-pencil"></i>
                            <span>#{msg['button.edit']}</span>

                        </h:link>

                        <p:commandButton
                                value="#{msg['button.delete']}"
                                icon="pi pi-trash"
                                action="#{HolidayListBean.deleteHoliday(holiday)}"
                                ajax="false"
                                styleClass="ui-button-danger action-btn">

                            <p:confirm
                                    header="#{msg['holiday.delete.header']}"
                                    message="#{msg['holiday.delete.message']}"
                                    icon="pi pi-exclamation-triangle"/>

                        </p:commandButton>

                    </p:column>

                </p:dataTable>

            </div>

            <p:confirmDialog global="true">

                <p:commandButton
                        value="#{msg['button.yes']}"
                        type="button"
                        styleClass="ui-confirmdialog-yes"
                        icon="pi pi-check"/>

                <p:commandButton
                        value="#{msg['button.no']}"
                        type="button"
                        styleClass="ui-confirmdialog-no ui-button-secondary"
                        icon="pi pi-times"/>

            </p:confirmDialog>

        </h:form>

    </ui:define>

</ui:composition>
