<?xml version="1.0" encoding="UTF-8"?>

<ui:composition
    template="/WEB-INF/templates/page-layout.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="http://primefaces.org/ui">

    <f:metadata>

        <f:viewParam
            name="id"
            value="#{adminUserBean.id}"/>

        <f:viewAction
            action="#{adminUserBean.init}"/>

    </f:metadata>

    <ui:define name="pageTitle">
        #{adminUserBean.newUser ? msg['user.add'] : msg['user.edit']}
    </ui:define>

    <ui:define name="pageHeadline">
        #{adminUserBean.newUser ? msg['user.add'] : msg['user.edit']}
    </ui:define>

    <ui:define name="navigation">
        <ui:include src="/WEB-INF/components/navigation.xhtml"/>
    </ui:define>

    <ui:define name="headerActions">
        <ui:include src="/WEB-INF/components/header-actions.xhtml" />
    </ui:define>

    <ui:define name="content">

        <section class="card user-form-card">

            <h:form id="userForm">

                <p:messages
                    id="messages"
                    showDetail="true"
                    closable="true"
                    styleClass="app-messages"
                />

                <!-- First Name -->
                <div class="form-field">

                    <p:outputLabel
                        for="firstName"
                        value="#{msg['user.firstName']}"/>

                    <p:inputText
                        id="firstName"
                        value="#{adminUserBean.person.firstName}"
                        required="true"
                        placeholder="#{msg['user.firstName.placeholder']}"
                        styleClass="form-input"/>

                </div>

                <!-- Last Name -->
                <div class="form-field">

                    <p:outputLabel
                        for="lastName"
                        value="#{msg['user.lastName']}"/>

                    <p:inputText
                        id="lastName"
                        value="#{adminUserBean.person.lastName}"
                        required="true"
                        placeholder="#{msg['user.lastName.placeholder']}"
                        styleClass="form-input"/>

                </div>

                <!-- Email -->
                <div class="form-field">

                    <p:outputLabel
                        for="email"
                        value="#{msg['user.email']}"/>

                    <p:inputText
                        id="email"
                        value="#{adminUserBean.person.emailAddress}"
                        required="true"
                        placeholder="#{msg['user.email.placeholder']}"
                        styleClass="form-input"/>

                </div>

                <!-- Initial Password -->
                <ui:fragment rendered="#{adminUserBean.newUser}">

                    <div class="form-field">

                        <p:outputLabel
                            for="password"
                            value="#{msg['user.initialPassword']}"/>

                        <p:password
                            id="password"
                            value="#{adminUserBean.person.password}"
                            required="true"
                            feedback="false"
                            placeholder="#{msg['user.initialPassword.placeholder']}"
                            styleClass="form-input"/>

                    </div>

                </ui:fragment>

                <!-- Roles -->
                <div class="form-field">

                    <p:outputLabel
                        for="role"
                        value="#{msg['user.roles']}"/>

                    <p:selectManyCheckbox
                        id="role"
                        value="#{adminUserBean.selectedRoleNames}"
                        required="true"
                        layout="responsive"
                        columns="1">

                        <f:selectItems
                            value="#{adminUserBean.roles}"
                            var="role"
                            itemValue="#{role.name()}"
                            itemLabel="#{msg['role.'.concat(role.name())]}"/>

                    </p:selectManyCheckbox>

                </div>

                <!-- Consent -->
                <div class="form-checkbox">

                    <p:selectBooleanCheckbox
                        id="consent"
                        value="#{adminUserBean.person.consent}"/>

                    <p:outputLabel
                        for="consent"
                        value="#{msg['user.dataProcessingConsent']}"/>

                </div>

                <!-- Actions -->
                <div class="form-actions">

                    <p:commandButton
                        value="#{msg['button.save']}"
                        icon="pi pi-save"
                        action="#{adminUserBean.save}"
                        ajax="false"/>

                    <p:commandButton
                        value="#{msg['button.cancel']}"
                        icon="pi pi-times"
                        action="#{adminUserBean.cancel}"
                        immediate="true"
                        ajax="false"
                        styleClass="ui-button-secondary"/>

                    <p:commandButton
                        value="#{msg['button.delete']}"
                        icon="pi pi-trash"
                        action="#{adminUserBean.delete}"
                        ajax="false"
                        rendered="#{not adminUserBean.newUser}"
                        styleClass="ui-button-danger">

                        <p:confirm
                            header="#{msg['user.delete.header']}"
                            message="#{msg['user.delete.message']}"
                            icon="pi pi-exclamation-triangle"/>

                    </p:commandButton>

                    <p:confirmDialog global="true">

                        <p:commandButton
                            value="#{msg['button.yes']}"
                            type="button"
                            styleClass="ui-confirmdialog-yes"
                            icon="pi pi-check"/>

                        <p:commandButton
                            value="#{msg['button.no']}"
                            type="button"
                            styleClass="ui-confirmdialog-no ui-button-secondary"
                            icon="pi pi-times"/>

                    </p:confirmDialog>

                </div>

            </h:form>

        </section>

    </ui:define>

</ui:composition>
