<?xml version="1.0" encoding="UTF-8"?>

<ui:composition
        template="/WEB-INF/templates/page-layout.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="jakarta.faces.html"
        xmlns:f="jakarta.faces.core"
        xmlns:ui="jakarta.faces.facelets"
        xmlns:p="http://primefaces.org/ui">

    <f:metadata>

        <f:viewParam
                name="id"
                value="#{adminUserBean.id}"/>

        <f:viewAction
                action="#{adminUserBean.init}"/>

    </f:metadata>


    <ui:define name="pageTitle">
        #{adminUserBean.newUser ? 'Add User' : 'Edit User'}
    </ui:define>


    <ui:define name="pageHeadline">
        #{adminUserBean.newUser ? 'Add User' : 'Edit User'}
    </ui:define>


    <ui:define name="navigation">
        <ui:include src="/WEB-INF/components/navigation.xhtml"/>
    </ui:define>


    <ui:define name="headerActions">

        <div class="user-info">

            <span class="user-name">
                #{mockUserBean.fullName}
            </span>

            <span class="user-role">
                #{mockUserBean.role}
            </span>

        </div>

    </ui:define>


    <ui:define name="content">

        <section class="card user-form-card">

            <h:form id="userForm">

                <p:messages
                        showDetail="true"
                        closable="true"/>


                <div class="form-field">

                    <p:outputLabel
                            for="firstName"
                            value="First name"/>

                    <p:inputText
                            id="firstName"
                            value="#{adminUserBean.person.firstName}"
                            required="true"
                            styleClass="form-input"/>

                </div>


                <div class="form-field">

                    <p:outputLabel
                            for="lastName"
                            value="Last name"/>

                    <p:inputText
                            id="lastName"
                            value="#{adminUserBean.person.lastName}"
                            required="true"
                            styleClass="form-input"/>

                </div>


                <div class="form-field">

                    <p:outputLabel
                            for="email"
                            value="Email"/>

                    <p:inputText
                            id="email"
                            value="#{adminUserBean.person.emailAddress}"
                            required="true"
                            styleClass="form-input"/>

                </div>


                <ui:fragment rendered="#{adminUserBean.newUser}">

                    <div class="form-field">

                        <p:outputLabel
                                for="password"
                                value="Initial password"/>

                        <p:password
                                id="password"
                                value="#{adminUserBean.person.password}"
                                required="true"
                                feedback="false"
                                styleClass="form-input"/>

                    </div>

                </ui:fragment>


                <div class="form-field">

                    <p:outputLabel
                            for="role"
                            value="Role"/>

                    <p:selectOneMenu
                            id="role"
                            value="#{adminUserBean.person.role}"
                            required="true">

                        <f:selectItems
                                value="#{adminUserBean.roles}"
                                var="role"
                                itemValue="#{role}"
                                itemLabel="#{role}"/>

                    </p:selectOneMenu>

                </div>


                <div class="form-checkbox">

                    <p:selectBooleanCheckbox
                            id="consent"
                            value="#{adminUserBean.person.consent}"/>

                    <p:outputLabel
                            for="consent"
                            value="Data processing consent"/>

                </div>


                <div class="form-actions">

                    <p:commandButton
                            value="Save"
                            icon="pi pi-save"
                            action="#{adminUserBean.save}"
                            ajax="false"/>

                    <p:commandButton
                            value="Cancel"
                            icon="pi pi-times"
                            action="#{adminUserBean.cancel}"
                            immediate="true"
                            ajax="false"
                            styleClass="ui-button-secondary"/>

                    <p:commandButton
                            value="Delete"
                            icon="pi pi-trash"
                            action="#{adminUserBean.delete}"
                            ajax="false"
                            rendered="#{not adminUserBean.newUser}"
                            styleClass="ui-button-danger">

                        <p:confirm
                                header="Delete user"
                                message="Are you sure you want to delete this user?"
                                icon="pi pi-exclamation-triangle"/>

                    </p:commandButton>

                    <p:confirmDialog global="true">

                        <p:commandButton
                                value="Yes"
                                type="button"
                                styleClass="ui-confirmdialog-yes"
                                icon="pi pi-check"/>

                        <p:commandButton
                                value="No"
                                type="button"
                                styleClass="ui-confirmdialog-no ui-button-secondary"
                                icon="pi pi-times"/>

                    </p:confirmDialog>

                </div>

            </h:form>

        </section>

    </ui:define>

</ui:composition>
