<?xml version="1.0" encoding="UTF-8"?>

<ui:composition
    template="/WEB-INF/templates/page-layout.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="http://primefaces.org/ui">

    <!-- Page Title -->
    <ui:define name="pageTitle">
        #{msg['users.title']}
    </ui:define>

    <!-- Page Headline -->
    <ui:define name="pageHeadline">
        #{msg['users.management']}
    </ui:define>

    <!-- Navigation -->
    <ui:define name="navigation">
        <ui:include src="/WEB-INF/components/navigation.xhtml"/>
    </ui:define>

    <!-- Header Actions -->
    <ui:define name="headerActions">
        <div class="user-info">
            <span class="user-name">
                #{loginBean.user.firstName} #{loginBean.user.lastName}
            </span>
            <ui:repeat
                value="#{loginBean.user.roles}"
                var="role">
                <span class="badge">
                    #{msg['role.'.concat(role.name())]}
                </span>
            </ui:repeat>
        </div>
    </ui:define>

    <ui:define name="content">

        <section class="page-section-header">

            <div>

                <h2>
                    #{msg['users.title']}
                </h2>

                <p class="text-muted">
                    #{msg['users.description']}
                </p>

            </div>

            <p:button
                value="#{msg['user.add']}"
                icon="pi pi-user-plus"
                outcome="/views/admin/edit-user"/>

        </section>

        <section class="card">

            <h:form id="usersForm">

                <p:dataTable
                    id="usersTable"
                    widgetVar="usersTable"
                    value="#{PersonListBean.persons}"
                    var="person"
                    paginator="true"
                    rows="10"
                    stripedRows="true"
                    sortMode="single"
                    emptyMessage="#{msg['users.noUsers']}">

                    <!-- Name -->
                    <p:column
                        headerText="#{msg['user.name']}"
                        sortBy="#{person.lastName}"
                        filterBy="#{person.lastName}"
                        filterMatchMode="contains">

                        <h:outputText
                            value="#{person.firstName} #{person.lastName}"/>

                    </p:column>

                    <!-- Email -->
                    <p:column
                        headerText="#{msg['user.email']}"
                        sortBy="#{person.emailAddress}"
                        filterBy="#{person.emailAddress}"
                        filterMatchMode="contains">

                        <h:outputText
                            value="#{person.emailAddress}"/>

                    </p:column>

                    <!-- Role -->
                    <p:column
                        headerText="#{msg['user.role']}"
                        sortBy="#{person.role}"
                        filterBy="#{person.role}"
                        filterMatchMode="exact">

                        <f:facet name="filter">

                            <p:selectOneMenu
                                onchange="PF('usersTable').filter()">

                                <f:selectItem
                                    itemLabel="#{msg['common.all']}"
                                    itemValue="#{null}"
                                    noSelectionOption="true"/>

                                <f:selectItems
                                    value="#{PersonListBean.roles}"
                                    var="role"
                                    itemLabel="#{msg['role.'.concat(role.name())]}"
                                    itemValue="#{role}"/>

                            </p:selectOneMenu>

                        </f:facet>

                        <span class="role-badge">
                            <ui:repeat value="#{person.role}" var="r">
                                #{msg['role.'.concat(r.name())]} 
                            </ui:repeat>
                        </span>

                    </p:column>

                    <!-- Consent -->
                    <p:column
                        headerText="#{msg['user.consent']}"
                        styleClass="table-small-column">

                        <i class="#{person.consent
                                    ? 'pi pi-check text-success'
                                    : 'pi pi-times text-muted'}">
                        </i>

                    </p:column>

                    <!-- Actions -->
                    <p:column
                        headerText="#{msg['common.actions']}"
                        styleClass="table-actions-column">

                        <p:button
                            icon="pi pi-pencil"
                            title="#{msg['user.edit']}"
                            outcome="/views/admin/edit-user"
                            styleClass="ui-button-secondary">

                            <f:param
                                name="id"
                                value="#{person.id}"/>

                        </p:button>

                    </p:column>

                </p:dataTable>

            </h:form>

        </section>

    </ui:define>

</ui:composition>
