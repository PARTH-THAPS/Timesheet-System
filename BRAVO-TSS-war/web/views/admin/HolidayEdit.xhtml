<?xml version="1.0" encoding="UTF-8"?>

<ui:composition
        template="/WEB-INF/templates/page-layout.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="jakarta.faces.html"
        xmlns:f="jakarta.faces.core"
        xmlns:ui="jakarta.faces.facelets"
        xmlns:p="http://primefaces.org/ui">

    <f:metadata>

        <f:viewParam
                name="id"
                value="#{EditHolidayBean.id}"/>

        <f:viewAction
                action="#{EditHolidayBean.init}"/>

    </f:metadata>


    <ui:define name="pageTitle">
        #{EditHolidayBean.newHoliday ? 'Add Holiday' : 'Edit Holiday'}
    </ui:define>


    <ui:define name="pageHeadline">
        #{EditHolidayBean.newHoliday ? 'Add Holiday' : 'Edit Holiday'}
    </ui:define>


    <ui:define name="navigation">
        <ui:include src="/WEB-INF/components/navigation.xhtml"/>
    </ui:define>


    <ui:define name="content">

        <section class="card holiday-form-card">

            <h:form id="holidayForm">

                <p:messages
                        showDetail="true"
                        closable="true"/>


                <div class="form-field">

                    <p:outputLabel
                            for="holidayName"
                            value="Holiday name"/>

                    <p:inputText
                            id="holidayName"
                            value="#{EditHolidayBean.holidaydto.holiday}"
                            required="true"
                            styleClass="form-input"/>

                </div>


                <div class="form-field">

                    <p:outputLabel
                            for="date"
                            value="Date"/>

                    <p:datePicker
                            id="date"
                            value="#{EditHolidayBean.holidaydto.date}"
                            pattern="dd.MM.yyyy"
                            required="true"
                            styleClass="form-input"/>

                </div>


                <div class="form-field">

                    <p:outputLabel
                            for="day"
                            value="Day"/>

                    <p:inputText
                            id="day"
                            value="#{EditHolidayBean.holidaydto.day}"
                            required="true"
                            styleClass="form-input"/>

                </div>


                <div class="form-field">

                    <p:outputLabel
                            for="year"
                            value="Year"/>

                    <p:inputNumber
                            id="year"
                            value="#{EditHolidayBean.holidaydto.year}"
                            required="true"
                            styleClass="form-input"/>

                </div>


                <div class="form-field">

                    <p:outputLabel
                            for="state"
                            value="State"/>

                    <p:selectOneMenu
                            id="state"
                            value="#{EditHolidayBean.holidaydto.state}"
                            required="true">

                        <f:selectItems
                                value="#{EditHolidayBean.states}"
                                var="state"
                                itemValue="#{state}"
                                itemLabel="#{state}"/>

                    </p:selectOneMenu>

                </div>


                <div class="form-actions">

                    <p:commandButton
                            value="Save"
                            icon="pi pi-save"
                            action="#{EditHolidayBean.save}"
                            ajax="false"
                            styleClass="action-btn"/>

                    <p:commandButton
                            value="Cancel"
                            icon="pi pi-times"
                            action="#{EditHolidayBean.cancel}"
                            immediate="true"
                            ajax="false"
                            styleClass="ui-button-secondary action-btn"/>

                    <p:commandButton
                            value="Delete"
                            icon="pi pi-trash"
                            action="#{EditHolidayBean.delete}"
                            ajax="false"
                            rendered="#{not EditHolidayBean.newHoliday}"
                            styleClass="ui-button-danger action-btn">

                        <p:confirm
                                header="Delete holiday"
                                message="Are you sure you want to delete this holiday?"
                                icon="pi pi-exclamation-triangle"/>

                    </p:commandButton>

                    <p:confirmDialog global="true">

                        <p:commandButton
                                value="Yes"
                                type="button"
                                styleClass="ui-confirmdialog-yes"
                                icon="pi pi-check"/>

                        <p:commandButton
                                value="No"
                                type="button"
                                styleClass="ui-confirmdialog-no ui-button-secondary"
                                icon="pi pi-times"/>

                    </p:confirmDialog>

                </div>

            </h:form>

        </section>

    </ui:define>

</ui:composition>
