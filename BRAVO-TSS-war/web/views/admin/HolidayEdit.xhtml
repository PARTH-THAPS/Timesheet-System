<?xml version="1.0" encoding="UTF-8"?>
<ui:composition
        template="/WEB-INF/templates/page-layout.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="jakarta.faces.html"
        xmlns:f="jakarta.faces.core"
        xmlns:ui="jakarta.faces.facelets"
        xmlns:p="http://primefaces.org/ui">

    <f:metadata>
        <f:viewParam
                name="id"
                value="#{EditHolidayBean.id}"/>
        <f:viewAction
                action="#{EditHolidayBean.init}"/>
    </f:metadata>

    <ui:define name="pageTitle">
        #{EditHolidayBean.newHoliday ? msg['holiday.add'] : msg['holiday.edit']}
    </ui:define>

    <ui:define name="pageHeadline">
        #{EditHolidayBean.newHoliday ? msg['holiday.add'] : msg['holiday.edit']}
    </ui:define>

    <ui:define name="navigation">
        <ui:include src="/WEB-INF/components/navigation.xhtml"/>
    </ui:define>
    
    <ui:define name="headerActions">
        <ui:include src="/WEB-INF/components/header-actions.xhtml" />
    </ui:define>

    <ui:define name="content">
        <section class="card holiday-form-card">

            <h:form id="holidayForm">

                <p:messages
                    id="messages"
                    showDetail="true"
                    closable="true"
                    styleClass="app-messages"
                />

                <div class="form-field">
                    <p:outputLabel
                            for="holidayName"
                            value="#{msg['holiday.name']}"/>

                    <p:inputText
                            id="holidayName"
                            value="#{EditHolidayBean.holidaydto.holiday}"
                            required="true"
                            placeholder="#{msg['holiday.name.placeholder']}"
                            styleClass="form-input"/>
                </div>

                <div class="form-field">
                    <p:outputLabel
                            for="date"
                            value="#{msg['holiday.date']}"/>

                    <p:datePicker
                            id="date"
                            value="#{EditHolidayBean.holidaydto.date}"
                            pattern="dd.MM.yyyy"
                            required="true"
                            placeholder="#{msg['holiday.date.placeholder']}"
                            styleClass="form-input"/>
                </div>

                <div class="form-field">
                    <p:outputLabel
                            for="day"
                            value="#{msg['holiday.day']}"/>

                    <p:inputText
                            id="day"
                            value="#{EditHolidayBean.holidaydto.day}"
                            required="true"
                            placeholder="#{msg['holiday.day.placeholder']}"
                            styleClass="form-input"/>
                </div>

                <div class="form-field">
                    <p:outputLabel
                            for="year"
                            value="#{msg['holiday.year']}"/>

                    <p:inputNumber
                            id="year"
                            value="#{EditHolidayBean.holidaydto.year}"
                            required="true"
                            placeholder="#{msg['holiday.year.placeholder']}"
                            styleClass="form-input"/>
                </div>

                <div class="form-field">
                    <p:outputLabel
                            for="state"
                            value="#{msg['holiday.state']}"/>

                    <p:selectOneMenu
                            id="state"
                            value="#{EditHolidayBean.holidaydto.state}"
                            required="true">

                        <f:selectItems
                                value="#{EditHolidayBean.states}"
                                var="state"
                                itemValue="#{state}"
                                itemLabel="#{state}"/>
                    </p:selectOneMenu>
                </div>

                <div class="form-actions">

                    <p:commandButton
                            value="#{msg['button.save']}"
                            icon="pi pi-save"
                            action="#{EditHolidayBean.save}"
                            ajax="false"
                            styleClass="action-btn"/>

                    <p:commandButton
                            value="#{msg['button.cancel']}"
                            icon="pi pi-times"
                            action="#{EditHolidayBean.cancel}"
                            immediate="true"
                            ajax="false"
                            styleClass="ui-button-secondary action-btn"/>

                    <p:commandButton
                            value="#{msg['button.delete']}"
                            icon="pi pi-trash"
                            action="#{EditHolidayBean.delete}"
                            ajax="false"
                            rendered="#{not EditHolidayBean.newHoliday}"
                            styleClass="ui-button-danger action-btn">

                        <p:confirm
                                header="#{msg['holiday.delete.header']}"
                                message="#{msg['holiday.delete.message']}"
                                icon="pi pi-exclamation-triangle"/>
                    </p:commandButton>

                    <p:confirmDialog global="true">

                        <p:commandButton
                                value="#{msg['button.yes']}"
                                type="button"
                                styleClass="ui-confirmdialog-yes"
                                icon="pi pi-check"/>

                        <p:commandButton
                                value="#{msg['button.no']}"
                                type="button"
                                styleClass="ui-confirmdialog-no ui-button-secondary"
                                icon="pi pi-times"/>
                    </p:confirmDialog>

                </div>

            </h:form>

        </section>
    </ui:define>

</ui:composition>
