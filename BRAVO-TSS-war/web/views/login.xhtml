<?xml version="1.0" encoding="UTF-8"?>
<ui:composition
        template="/WEB-INF/templates/page-layout.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="jakarta.faces.html"
        xmlns:f="jakarta.faces.core"
        xmlns:ui="jakarta.faces.facelets"
        xmlns:p="http://primefaces.org/ui">

    <f:metadata>
        <f:viewParam name="error" value="#{loginErrorBean.error}"/>
    </f:metadata>

    <ui:define name="pageTitle">
        Login
    </ui:define>

    <ui:define name="pageHeadline">
    </ui:define>

    <ui:define name="content">
        <section class="auth-container">
            <div class="card auth-card">
                <p class="text-muted auth-description">
                    Login to access BRAVO-TSS.
                </p>

                <ui:fragment rendered="#{loginErrorBean.error}">
                    <div class="app-message app-message-error">
                        <i class="pi pi-times-circle"></i>

                        <div class="app-message-content">
                            <strong>Login failed</strong>
                            <span>
                                Invalid email or password. Please try again.
                            </span>
                        </div>
                    </div>
                </ui:fragment>

                <form action="j_security_check" method="POST">
                    <div class="form-field">
                        <label for="username">
                            Email
                        </label>
                        <input
                            id="username"
                            name="j_username"
                            type="email"
                            class="form-input"
                            placeholder="name@example.com"/>
                    </div>
                    <div class="form-field">
                        <label for="password">
                            Password
                        </label>
                        <input
                            id="password"
                            name="j_password"
                            type="password"
                            class="form-input"
                            placeholder="Password"/>
                    </div>
                    <div class="form-actions auth-actions">
                        <button
                            type="submit"
                            class="button button-primary">
                            Log In
                        </button>
                    </div>
                </form>
                <p class="auth-footer">
                    No account yet?
                    <h:link
                        outcome="/signup"
                        value="Create an account"/>
                </p>
            </div>
        </section>
    </ui:define>
</ui:composition>
