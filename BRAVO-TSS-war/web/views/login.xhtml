<?xml version="1.0" encoding="UTF-8"?>
<ui:composition
    template="/WEB-INF/templates/page-layout.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="http://primefaces.org/ui">

    <f:metadata>
        <f:viewParam name="error" value="#{loginErrorBean.error}"/>
    </f:metadata>

    <ui:define name="pageTitle">
        #{msg['login.title']}
    </ui:define>

    <ui:define name="pageHeadline">
        #{msg['login.title']}
    </ui:define>
    
    <ui:define name="headerActions">
        <ui:include src="/WEB-INF/components/language-selector.xhtml"/>
    </ui:define>

    <ui:define name="content">
        <section class="auth-container">
            <div class="card auth-card">
                <p class="text-muted auth-description">
                    #{msg['login.description']}
                </p>

                <ui:fragment rendered="#{loginErrorBean.error}">
                    <div class="app-message app-message-error">
                        <i class="pi pi-times-circle"></i>

                        <div class="app-message-content">
                            <strong>#{msg['login.failed']}</strong>
                            <span>
                                #{msg['login.failed.detail']}
                            </span>
                        </div>
                    </div>
                </ui:fragment>

                <form action="j_security_check" method="POST">
                    <div class="form-field">
                        <label for="username">
                            #{msg['login.email']}
                        </label>
                        <input
                            id="username"
                            name="j_username"
                            type="email"
                            class="form-input"
                            placeholder="#{msg['login.email.placeholder']}"/>
                    </div>

                    <div class="form-field">
                        <label for="password">
                            #{msg['login.password']}
                        </label>
                        <input
                            id="password"
                            name="j_password"
                            type="password"
                            class="form-input"
                            placeholder="#{msg['login.password.placeholder']}"/>
                    </div>

                    <div class="form-actions auth-actions">
                        <button
                            type="submit"
                            class="button button-primary">
                            #{msg['login.submit']}
                        </button>
                    </div>
                </form>

                <p class="auth-footer">
                    #{msg['login.signupPrompt']}
                    <h:link
                        outcome="/signup"
                        value="#{msg['login.signupLink']}"/>
                </p>
            </div>
        </section>
    </ui:define>
</ui:composition>
