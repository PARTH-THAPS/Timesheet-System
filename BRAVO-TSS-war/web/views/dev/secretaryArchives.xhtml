<?xml version="1.0" encoding="UTF-8" ?>
<ui:composition
    template="/WEB-INF/templates/page-layout.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:p="http://primefaces.org/ui">

    <ui:param
        name="pageHeadline"
        value="#{msg['timesheet.title']}" />

    <ui:define name="content">
        <h:form id="timesheetForm">

            <p:dataTable
                id="tsTable"
                var="ts"
                value="#{secretaryArchivesBean.timesheetList}"
                emptyMessage="#{msg['timesheet.noAccountTimesheets']}"
                paginator="true"
                rows="10">

                <p:column headerText="#{msg['timesheet.period']}">
                    <h:outputText value="#{ts.startDate}">
                        <f:convertDateTime
                            type="localDate"
                            pattern="dd.MM.yyyy" />
                    </h:outputText>
                    <span> - </span>
                    <h:outputText value="#{ts.endDate}">
                        <f:convertDateTime
                            type="localDate"
                            pattern="dd.MM.yyyy" />
                    </h:outputText>
                </p:column>

                <p:column headerText="#{msg['timesheet.approvalStatus']}">
                    <h:outputText
                        value="#{msg['timesheet.status.'.concat(ts.status.name())]}" />
                </p:column>

                <p:column headerText="#{msg['timesheet.hoursDue']}">
                    <h:outputText value="#{ts.hoursDue}">
                        <f:convertNumber
                            minFractionDigits="2"
                            maxFractionDigits="2" />
                    </h:outputText>
                    <span> #{msg['timesheet.hoursUnit']}</span>
                </p:column>

                <p:column headerText="#{msg['timesheet.employeeSigned']}">
                    <ui:fragment rendered="#{not empty ts.signedByEmployee}">
                        <h:outputText value="#{ts.signedByEmployee}">
                            <f:convertDateTime
                                type="localDate"
                                pattern="dd.MM.yyyy" />
                        </h:outputText>
                    </ui:fragment>
                    <ui:fragment rendered="#{empty ts.signedByEmployee}">
                        <i class="pi pi-minus text-muted"></i>
                    </ui:fragment>
                </p:column>

                <p:column headerText="#{msg['timesheet.supervisorSigned']}">
                    <ui:fragment rendered="#{not empty ts.signedBySupervisor}">
                        <h:outputText value="#{ts.signedBySupervisor}">
                            <f:convertDateTime
                                type="localDate"
                                pattern="dd.MM.yyyy" />
                        </h:outputText>
                    </ui:fragment>
                    <ui:fragment rendered="#{empty ts.signedBySupervisor}">
                        <i class="pi pi-minus text-muted"></i>
                    </ui:fragment>
                </p:column>

                <p:column headerText="#{msg['archive.archive']}">
                    <p:commandButton
                        id="storeButton"
                        value="#{msg['archive.archive']}"
                        styleClass="ui-button-success"
                        icon="pi pi-check"
                        action="#{secretaryArchivesBean.archiveTimesheet(ts.id)}"
                        update="tsTable" />
                </p:column>

            </p:dataTable>

        </h:form>
    </ui:define>

</ui:composition>
