<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition template="/WEB-INF/templates/page-layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="http://primefaces.org/ui">

    <ui:param name="pageHeadline" value="Timesheets"/>

    <ui:define name="content">
        <h:form id="timesheetForm">

            <p:dataTable id="tsTable"
                         var="ts"
                         value="#{secretaryArchivesBean.timesheetList}"
                         emptyMessage="No timesheets found for your account."
                         paginator="true"
                         rows="10">

                <p:column headerText="Period">
                    <h:outputText value="#{ts.startDate}">
                        <f:convertDateTime type="localDate" pattern="dd.MM.yyyy" />
                    </h:outputText>
                    -
                    <h:outputText value="#{ts.endDate}">
                        <f:convertDateTime type="localDate" pattern="dd.MM.yyyy" />
                    </h:outputText>
                </p:column>

                <p:column headerText="Status">
                    <h:outputText value="#{ts.status}" />
                </p:column>

                <p:column headerText="Hours Due">
                    <h:outputText value="#{ts.hoursDue}" />
                </p:column>

                <p:column headerText="Employee Signed">
                    <h:outputText value="#{ts.signedByEmployee}">
                        <f:convertDateTime type="localDate" pattern="dd.MM.yyyy" />
                    </h:outputText>
                </p:column>

                <p:column headerText="Supervisor Signed">
                    <h:outputText value="#{ts.signedBySupervisor}">
                        <f:convertDateTime type="localDate" pattern="dd.MM.yyyy" />
                    </h:outputText>
                </p:column>

                <p:column headerText="Archive">

                    <p:commandButton id="storeButton"
                                     styleClass="ui-button-success"
                                     icon="pi pi-check"
                                     action="#{secretaryArchivesBean.archiveTimesheet(ts.id)}"
                                     update="tsTable" />

                </p:column>

            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
