<?xml version="1.0" encoding="UTF-8"?>

<ui:composition
    template="/WEB-INF/templates/page-layout.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="http://primefaces.org/ui">

    <ui:define name="pageTitle">
        #{msg['contracts.title']}
    </ui:define>

    <ui:define name="pageHeadline">
        #{msg['contracts.management']}
    </ui:define>

    <ui:define name="navigation">
        <ui:include src="/WEB-INF/components/navigation.xhtml"/>
    </ui:define>

    <ui:define name="headerActions">
        <div class="user-info">
            <span class="user-name">
                #{loginBean.user.firstName} #{loginBean.user.lastName}
            </span>
            <ui:repeat
                value="#{loginBean.user.roles}"
                var="role">
                <span class="badge">
                    #{msg['role.'.concat(role.name())]}
                </span>
            </ui:repeat>
        </div>
    </ui:define>

    <ui:define name="content">

        <section class="page-section-header">
            <div>
                <h2>#{msg['contracts.title']}</h2>

                <p class="text-muted">
                    #{msg['contracts.description']}
                </p>
            </div>

            <p:button
                value="#{msg['contract.add']}"
                icon="pi pi-plus"
                outcome="/views/assistant/edit-contract"/>
        </section>

        <section class="card">

            <h:form id="contractsForm">

                <p:dataTable
                    id="contractsTable"
                    widgetVar="contractsTable"
                    value="#{contractListBean.contracts}"
                    var="contract"
                    paginator="true"
                    rows="10"
                    stripedRows="true"
                    sortMode="single"
                    emptyMessage="#{msg['contracts.noContracts']}">

                    <p:column
                        headerText="#{msg['contract.name']}"
                        sortBy="#{contract.name}"
                        filterBy="#{contract.name}"
                        filterMatchMode="contains">

                        <h:outputText value="#{contract.name}"/>

                    </p:column>

                    <p:column
                        headerText="#{msg['contract.employee']}"
                        sortBy="#{contractListBean.getPersonName(contract.personId)}"
                        filterBy="#{contractListBean.getPersonName(contract.personId)}"
                        filterMatchMode="contains">

                        <h:outputText
                            value="#{contractListBean.getPersonName(contract.personId)}"/>

                    </p:column>

                    <p:column
                        headerText="#{msg['contract.start']}"
                        sortBy="#{contract.startDate}">

                        <h:outputText value="#{contract.startDate}">
                            <f:convertDateTime
                                type="localDate"
                                pattern="dd.MM.yyyy"/>
                        </h:outputText>

                    </p:column>

                    <p:column
                        headerText="#{msg['contract.end']}"
                        sortBy="#{contract.endDate}">

                        <h:outputText value="#{contract.endDate}">
                            <f:convertDateTime
                                type="localDate"
                                pattern="dd.MM.yyyy"/>
                        </h:outputText>

                    </p:column>

                    <p:column
                        headerText="#{msg['contract.frequency']}"
                        sortBy="#{contract.frequency}">

                        <h:outputText value="#{contract.frequency}"/>

                    </p:column>

                    <p:column
                        headerText="#{msg['contract.hoursPerWeek']}"
                        sortBy="#{contract.hoursPerWeek}">

                        <h:outputText value="#{contract.hoursPerWeek}"/>

                    </p:column>

                    <p:column
                        headerText="#{msg['contract.status']}"
                        sortBy="#{contract.status}"
                        filterBy="#{contract.status}"
                        filterMatchMode="exact">

                        <f:facet name="filter">

                            <p:selectOneMenu
                                onchange="PF('contractsTable').filter()">

                                <f:selectItem
                                    itemLabel="#{msg['common.all']}"
                                    itemValue="#{null}"
                                    noSelectionOption="true"/>

                                <f:selectItems
                                    value="#{contractListBean.statuses}"
                                    var="status"
                                    itemLabel="#{msg['contract.status.'.concat(status.name())]}"
                                    itemValue="#{status}"/>

                            </p:selectOneMenu>

                        </f:facet>

                        <span class="status-badge">
                            #{msg['contract.status.'.concat(contract.status.name())]}
                        </span>

                    </p:column>

                    <p:column
                        headerText="#{msg['common.actions']}"
                        styleClass="table-actions-column">

                        <p:button
                            icon="pi pi-eye"
                            title="#{msg['contract.view']}"
                            outcome="/views/assistant/edit-contract"
                            styleClass="ui-button-secondary">

                            <f:param
                                name="id"
                                value="#{contract.id}"/>

                        </p:button>

                    </p:column>

                </p:dataTable>

            </h:form>

        </section>

    </ui:define>

</ui:composition>
