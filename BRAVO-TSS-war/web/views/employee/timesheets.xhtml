<?xml version="1.0" encoding="UTF-8"?>

<ui:composition
    template="/WEB-INF/templates/page-layout.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="http://primefaces.org/ui">

    <ui:define name="pageTitle">
        #{msg['timesheets.title']}
    </ui:define>

    <ui:define name="pageHeadline">
        #{msg['timesheets.title']}
    </ui:define>

    <ui:define name="navigation">
        <ui:include src="/WEB-INF/components/navigation.xhtml"/>
    </ui:define>

    <ui:define name="headerActions">
        <ui:include src="/WEB-INF/components/header-actions.xhtml" />
    </ui:define>

    <ui:define name="content">

        <section class="page-section-header">
            <div>
                <h2>#{msg['timesheets.title']}</h2>
                <p class="text-muted">
                    #{msg['timesheets.description']}
                </p>
            </div>
        </section>

        <section class="card">

            <p:dataTable
                id="timesheetsTable"
                value="#{timesheetBean.timesheetList}"
                var="timesheet"
                paginator="true"
                rows="12"
                stripedRows="true"
                emptyMessage="#{msg['timesheets.noTimesheets']}"
                sortMode="single">

                <p:column
                    headerText="#{msg['timesheets.period']}"
                    sortBy="#{timesheet.startDate}">

                    <h:outputText value="#{timesheet.startDate}">
                        <f:convertDateTime
                            type="localDate"
                            pattern="dd.MM.yyyy"/>
                    </h:outputText>

                    <span class="timesheet-period-separator">
                        –
                    </span>

                    <h:outputText value="#{timesheet.endDate}">
                        <f:convertDateTime
                            type="localDate"
                            pattern="dd.MM.yyyy"/>
                    </h:outputText>

                </p:column>

                <p:column
                    headerText="#{msg['timesheet.hoursDue']}"
                    sortBy="#{timesheet.hoursDue}"
                    styleClass="table-small-column">

                    <h:outputText value="#{timesheet.hoursDue}">
                        <f:convertNumber
                            minFractionDigits="2"
                            maxFractionDigits="2"/>
                    </h:outputText>

                    <span> h</span>

                </p:column>

                <p:column
                    headerText="#{msg['timesheet.balance']}"
                    sortBy="#{timesheet.balance}"
                    styleClass="table-small-column">

                    <h:outputText
                        value="#{timesheet.balance}"
                        styleClass="#{
                        timesheet.balance gt 0
                            ? 'text-success'
                            : timesheet.balance lt 0
                            ? 'text-warning'
                            : ''
        }">
                        <f:convertNumber
                            minFractionDigits="2"
                            maxFractionDigits="2"/>
                    </h:outputText>

                    <span> h</span>

                </p:column>

                <p:column
                    headerText="#{msg['timesheet.approvalStatus']}"
                    sortBy="#{timesheet.status}">
                    <span class="status-badge status-#{timesheet.status}">
                        #{msg['timesheet.status.'.concat(timesheet.status)]}
                    </span>

                </p:column>

                <p:column
                    headerText="#{msg['timesheets.employeeSigned']}"
                    styleClass="table-small-column">

                    <ui:fragment rendered="#{not empty timesheet.signedByEmployee}">
                        <i class="pi pi-check text-success"></i>

                        <h:outputText value="#{timesheet.signedByEmployee}">
                            <f:convertDateTime
                                type="localDate"
                                pattern="dd.MM.yyyy"/>
                        </h:outputText>
                    </ui:fragment>

                    <ui:fragment rendered="#{empty timesheet.signedByEmployee}">
                        <i class="pi pi-minus text-muted"></i>
                    </ui:fragment>

                </p:column>

                <p:column
                    headerText="#{msg['timesheets.supervisorSigned']}"
                    styleClass="table-small-column">

                    <ui:fragment rendered="#{not empty timesheet.signedBySupervisor}">
                        <i class="pi pi-check text-success"></i>

                        <h:outputText value="#{timesheet.signedBySupervisor}">
                            <f:convertDateTime
                                type="localDate"
                                pattern="dd.MM.yyyy"/>
                        </h:outputText>
                    </ui:fragment>

                    <ui:fragment rendered="#{empty timesheet.signedBySupervisor}">
                        <i class="pi pi-minus text-muted"></i>
                    </ui:fragment>

                </p:column>

                <p:column
                    headerText="#{msg['common.actions']}"
                    styleClass="table-actions-column">

                    <p:button
                        value="#{msg['timesheets.open']}"
                        icon="pi pi-folder-open"
                        outcome="/views/employee/timesheet"
                        styleClass="ui-button-secondary">

                        <f:param
                            name="id"
                            value="#{timesheet.id}"/>

                    </p:button>

                </p:column>

            </p:dataTable>

        </section>

    </ui:define>

</ui:composition>
