<?xml version="1.0" encoding="UTF-8"?>

<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:p="http://primefaces.org/ui"
    template="/WEB-INF/templates/page-layout.xhtml">

    <f:metadata>
        <f:viewAction action="#{consentBean.init}"/>
    </f:metadata>

    <ui:define name="pageTitle">
        #{msg['consent.title']}
    </ui:define>

    <ui:define name="pageHeadline">
        #{msg['consent.title']}
    </ui:define>

    <ui:define name="navigation">
    </ui:define>

    <ui:define name="headerActions">
        <ui:include src="/WEB-INF/components/language-selector.xhtml"/>
    </ui:define>

    <ui:define name="content">

        <h:form id="consentForm">

            <p:messages
                id="messages"
                showDetail="true"
                closable="true"
                styleClass="app-messages"/>

            <div class="form-card">

                <p>#{msg['consent.description']}</p>

                <p>#{msg['consent.confirmation']}</p>

                <div class="form-actions">

                    <p:commandButton
                        value="#{msg['consent.accept']}"
                        icon="pi pi-check"
                        action="#{consentBean.accept}"
                        ajax="false"/>

                    <p:commandButton
                        value="#{msg['button.logout']}"
                        icon="pi pi-sign-out"
                        action="#{loginBean.logout}"
                        immediate="true"
                        ajax="false"
                        styleClass="ui-button-secondary"/>

                </div>

            </div>

        </h:form>

    </ui:define>

</ui:composition>
