<?xml version="1.0" encoding="UTF-8"?>
<ui:composition
    template="/WEB-INF/templates/page-layout.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="http://primefaces.org/ui">

    <ui:define name="pageTitle">
        Contract Archive
    </ui:define>

    <ui:define name="pageHeadline">
        Contract Archive
    </ui:define>

    <ui:define name="navigation">
        <ui:include src="/WEB-INF/components/navigation.xhtml"/>
    </ui:define>

    <ui:define name="headerActions">
        <div class="user-info">
            <span class="user-name">
                #{mockUserBean.fullName}
            </span>
            <span class="user-role">
                #{mockUserBean.role}
            </span>
        </div>
    </ui:define>

    <ui:define name="content">
        <section class="page-section-header">
            <div>
                <h2>All Contracts</h2>
                <p class="text-muted">
                    Select a contract to review its timesheets.
                </p>
            </div>
        </section>

        <section class="card">
            <h:form id="archiveContractsForm">
                <p:dataTable
                    id="contractsTable"
                    widgetVar="contractsTable"
                    value="#{archiveContractsBean.archivedContracts}"
                    var="contract"
                    paginator="true"
                    rows="10"
                    stripedRows="true"
                    sortMode="single"
                    emptyMessage="No contracts found.">

                    <p:column
                        headerText="Name"
                        sortBy="#{contract.name}"
                        filterBy="#{contract.name}"
                        filterMatchMode="contains">
                        <h:outputText value="#{contract.name}"/>
                    </p:column>

                    <p:column
                            headerText="Employee"
                            sortBy="#{archiveContractsBean.getPersonName(contract.personId)}"
                            filterBy="#{archiveContractsBean.getPersonName(contract.personId)}"
                            filterMatchMode="contains">
                        <h:outputText value="#{archiveContractsBean.getPersonName(contract.personId)}"/>
                    </p:column>

                    <p:column
                        headerText="Start"
                        sortBy="#{contract.startDate}">
                        <h:outputText value="#{contract.startDate}">
                            <f:convertDateTime type="localDate" pattern="dd.MM.yyyy"/>
                        </h:outputText>
                    </p:column>

                    <p:column
                        headerText="End"
                        sortBy="#{contract.endDate}">
                        <h:outputText value="#{contract.endDate}">
                            <f:convertDateTime type="localDate" pattern="dd.MM.yyyy"/>
                        </h:outputText>
                    </p:column>

                    <p:column
                        headerText="Status"
                        sortBy="#{contract.status}"
                        filterBy="#{contract.status}"
                        filterMatchMode="exact">
                        <span class="status-badge">
                            #{contract.status}
                        </span>
                    </p:column>

                    <p:column
                        headerText="Hours / Week"
                        sortBy="#{contract.hoursPerWeek}">
                        <h:outputText value="#{contract.hoursPerWeek}"/>
                    </p:column>

                    <p:column
                        headerText="Actions"
                        styleClass="table-actions-column">
                        <p:button
                            icon="pi pi-folder-open"
                            title="Open timesheets"
                            outcome="/views/shared/archive-contract-timesheets"
                            styleClass="ui-button-secondary">
                            <f:param
                                name="id"
                                value="#{contract.id}"/>
                        </p:button>
                    </p:column>

                </p:dataTable>
            </h:form>
        </section>
    </ui:define>
</ui:composition>
