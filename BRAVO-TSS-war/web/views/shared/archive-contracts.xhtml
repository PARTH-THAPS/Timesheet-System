<?xml version="1.0" encoding="UTF-8"?>

<ui:composition
    template="/WEB-INF/templates/page-layout.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="http://primefaces.org/ui">

    <ui:define name="pageTitle">
        #{msg['archive.contractArchive']}
    </ui:define>

    <ui:define name="pageHeadline">
        #{msg['archive.contractArchive']}
    </ui:define>

    <ui:define name="navigation">
        <ui:include src="/WEB-INF/components/navigation.xhtml"/>
    </ui:define>

    <ui:define name="headerActions">
        <ui:include src="/WEB-INF/components/header-actions.xhtml"/>
    </ui:define>

    <ui:define name="content">

        <section class="page-section-header">

            <div>

                <h2>
                    #{msg['archive.allContracts']}
                </h2>

                <p class="text-muted">
                    #{msg['archive.selectContract']}
                </p>

            </div>

        </section>

        <section class="card">

            <h:form id="archiveContractsForm">

                <p:dataTable
                    id="contractsTable"
                    widgetVar="contractsTable"
                    value="#{archiveContractsBean.archivedContracts}"
                    var="contract"
                    paginator="true"
                    rows="10"
                    stripedRows="true"
                    sortMode="single"
                    emptyMessage="#{msg['contracts.noContracts']}">

                    <p:column
                        headerText="#{msg['contract.name']}"
                        sortBy="#{contract.name}"
                        filterBy="#{contract.name}"
                        filterMatchMode="contains">

                        <h:outputText
                            value="#{contract.name}"/>

                    </p:column>

                    <p:column
                        headerText="#{msg['contract.employee']}"
                        sortBy="#{archiveContractsBean.getPersonName(contract.personId)}"
                        filterBy="#{archiveContractsBean.getPersonName(contract.personId)}"
                        filterMatchMode="contains">

                        <h:outputText
                            value="#{archiveContractsBean.getPersonName(contract.personId)}"/>

                    </p:column>

                    <p:column
                        headerText="#{msg['contract.start']}"
                        sortBy="#{contract.startDate}">

                        <h:outputText
                            value="#{contract.startDate}">

                            <f:convertDateTime
                                type="localDate"
                                pattern="dd.MM.yyyy"/>

                        </h:outputText>

                    </p:column>

                    <p:column
                        headerText="#{msg['contract.end']}"
                        sortBy="#{contract.endDate}">

                        <h:outputText
                            value="#{contract.endDate}">

                            <f:convertDateTime
                                type="localDate"
                                pattern="dd.MM.yyyy"/>

                        </h:outputText>

                    </p:column>

                    <p:column
                        headerText="#{msg['contract.status']}"
                        sortBy="#{contract.status}"
                        filterBy="#{msg['contract.status.'.concat(contract.status)]}"
                        filterMatchMode="exact">

                        <f:facet name="filter">

                            <p:selectOneMenu
                                onchange="PF('contractsTable').filter()">

                                <f:selectItem
                                    itemLabel="#{msg['common.all']}"
                                    itemValue="#{null}"
                                    noSelectionOption="true"/>

                                <f:selectItems
                                    value="#{archiveContractsBean.statuses}"
                                    var="status"
                                    itemValue="#{msg['contract.status.'.concat(status)]}"
                                    itemLabel="#{msg['contract.status.'.concat(status)]}"/>

                            </p:selectOneMenu>

                        </f:facet>

                        <span class="status-badge status-#{contract.status}">
                            #{msg['contract.status.'.concat(contract.status)]}
                        </span>

                    </p:column>

                    <p:column
                        headerText="#{msg['contract.hoursPerWeek']}"
                        sortBy="#{contract.hoursPerWeek}">

                        <h:outputText
                            value="#{contract.hoursPerWeek}"/>

                    </p:column>

                    <p:column
                        headerText="#{msg['common.actions']}"
                        styleClass="table-actions-column">

                        <p:button
                            icon="pi pi-folder-open"
                            title="#{msg['archive.openTimesheets']}"
                            outcome="/views/shared/archive-contract-timesheets"
                            styleClass="ui-button-secondary">

                            <f:param
                                name="id"
                                value="#{contract.id}"/>

                        </p:button>

                    </p:column>

                </p:dataTable>

            </h:form>

        </section>

    </ui:define>

</ui:composition>
