<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition
    template="/WEB-INF/templates/page-layout.xhtml"
    xmlns:b="http://bootsfaces.net/ui"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">

    <ui:param name="pageHeadline" value="${msg.signupPageHeadline}"/>

    <ui:define name="content">

        <h:messages globalOnly="false" showDetail="true" showSummary="true" styleClass="ui-messages"/>

        <h:form id="signupForm" class="form form-horizontal" role="form">

            <div class="field grid align-items-baseline">
                <h:outputLabel for="firstName" value="${msg.signupFirstNameLabel}"
                                styleClass="ui-outputlabel ui-widget col-2 ui-required"/>
                <h:inputText id="firstName"
                             value="#{personBean.personDto.firstName}"
                             required="true"
                             requiredMessage="#{msg.signupFirstNameRequired}"
                             styleClass="ui-inputfield ui-inputtext ui-widget ui-state-default ui-corner-all col-4 p-1"
                             pt:placeholder="#{msg.signupFirstNamePlaceholder}"/>
            </div>

            <div class="field grid align-items-baseline">
                <h:outputLabel for="lastName" value="${msg.signupLastNameLabel}"
                                styleClass="ui-outputlabel ui-widget col-2 ui-required"/>
                <h:inputText id="lastName"
                             value="#{personBean.personDto.lastName}"
                             required="true"
                             requiredMessage="#{msg.signupLastNameRequired}"
                             styleClass="ui-inputfield ui-inputtext ui-widget ui-state-default ui-corner-all col-4 p-1"
                             pt:placeholder="#{msg.signupLastNamePlaceholder}"/>
            </div>

            <div class="field grid align-items-baseline">
                <h:outputLabel for="emailAddress" value="${msg.signupEmailLabel}"
                                styleClass="ui-outputlabel ui-widget col-2 ui-required"/>
                <h:inputText id="emailAddress"
                             value="#{personBean.personDto.emailAddress}"
                             required="true"
                             requiredMessage="#{msg.signupEmailRequired}"
                             styleClass="ui-inputfield ui-inputtext ui-widget ui-state-default ui-corner-all col-4 p-1"
                             pt:placeholder="#{msg.signupEmailPlaceholder}"/>
            </div>

            <div class="field grid align-items-baseline">
                <h:outputLabel for="password" value="${msg.signupPasswordLabel}"
                                styleClass="ui-outputlabel ui-widget col-2 ui-required"/>
                <h:inputSecret id="password"
                                value="#{personBean.personDto.password}"
                                required="true"
                                requiredMessage="#{msg.signupPasswordRequired}"
                                styleClass="ui-inputfield ui-inputtext ui-widget ui-state-default ui-corner-all col-4 p-1"
                                pt:placeholder="#{msg.signupPasswordPlaceholder}"/>
            </div>

            <div class="field grid align-items-baseline">
                <h:selectBooleanCheckbox id="consent"
                                          value="#{personBean.personDto.consent}"
                                          styleClass="col-2"/>
                <h:outputLabel for="consent" value="${msg.signupConsentLabel}" styleClass="col-4"/>
            </div>


            <h:commandButton id="signupButton"
                              value="${msg.signupButtonLabel}"
                              action="#{personBean.createPerson}"
                              styleClass="ui-button ui-widget ui-state-default ui-corner-all ui-button-text-icon-left"/>

        </h:form>

        <div class="field grid align-items-baseline">
            <p>
                ${msg.signupLoginPrompt}
                <a id="loginLink" href="">${msg.signupLoginLinkLabel}</a>
            </p>
        </div>

    </ui:define>
</ui:composition>
