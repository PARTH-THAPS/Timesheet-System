<?xml version="1.0" encoding="UTF-8"?>
<ui:composition
    template="/WEB-INF/templates/page-layout.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="http://primefaces.org/ui">

    <ui:define name="pageTitle">
        #{msg['signup.title']}
    </ui:define>

    <ui:define name="pageHeadline">
        #{msg['signup.title']}
    </ui:define>

    <ui:define name="content">
        <section class="auth-container">
            <div class="card auth-card">

                <p class="text-muted auth-description">
                    #{msg['signup.description']}
                </p>

                <p:messages
                    id="formMessages"
                    showDetail="true"
                    closable="true"
                    styleClass="app-messages"
                    />

                <h:form id="signupForm">
                    <div class="form-field">
                        <p:outputLabel for="firstName" value="#{msg['signup.firstName']}"/>
                        <p:inputText
                            id="firstName"
                            value="#{CreatePersonBean.personDto.firstName}"
                            required="true"
                            requiredMessage="#{msg['signup.firstName.required']}"
                            styleClass="form-input"
                            placeholder="#{msg['signup.firstName.placeholder']}"/>
                        <p:message
                            for="firstName"
                            styleClass="field-message"/>
                    </div>

                    <div class="form-field">
                        <p:outputLabel
                            for="lastName"
                            value="#{msg['signup.lastName']}"/>

                        <p:inputText
                            id="lastName"
                            value="#{CreatePersonBean.personDto.lastName}"
                            required="true"
                            requiredMessage="#{msg['signup.lastName.required']}"
                            styleClass="form-input"
                            placeholder="#{msg['signup.lastName.placeholder']}"/>

                        <p:message
                            for="lastName"
                            styleClass="field-message"/>
                    </div>

                    <div class="form-field">
                        <p:outputLabel
                            for="emailAddress"
                            value="#{msg['signup.email']}"/>

                        <p:inputText
                            id="emailAddress"
                            value="#{CreatePersonBean.personDto.emailAddress}"
                            required="true"
                            requiredMessage="#{msg['signup.email.required']}"
                            styleClass="form-input"
                            placeholder="#{msg['signup.email.placeholder']}"/>

                        <p:message
                            for="emailAddress"
                            styleClass="field-message"/>
                    </div>

                    <div class="form-field">
                        <p:outputLabel
                            for="password"
                            value="#{msg['signup.password']}"/>

                        <p:password
                            id="password"
                            value="#{CreatePersonBean.personDto.password}"
                            required="true"
                            requiredMessage="#{msg['signup.password.required']}"
                            feedback="false"
                            styleClass="form-input"
                            placeholder="#{msg['signup.password.placeholder']}"/>

                        <p:message
                            for="password"
                            styleClass="field-message"/>
                    </div>

                    <div class="form-checkbox">
                        <p:selectBooleanCheckbox
                            id="consent"
                            value="#{CreatePersonBean.personDto.consent}"
                            required="true"
                            requiredMessage="#{msg['signup.consent.required']}"/>

                        <p:outputLabel
                            for="consent"
                            value="#{msg['signup.consent']}"/>
                    </div>

                    <p:message
                        for="consent"
                        styleClass="field-message"/>

                    <div class="form-actions auth-actions">
                        <p:commandButton
                            value="#{msg['signup.submit']}"
                            icon="pi pi-user-plus"
                            action="#{CreatePersonBean.createPerson}"
                            update="signupForm formMessages"/>
                    </div>
                </h:form>

                <p class="auth-footer">
                    #{msg['signup.loginPrompt']}
                    <h:link
                        outcome="/index"
                        value="#{msg['signup.loginLink']}"/>
                </p>

            </div>
        </section>
    </ui:define>

</ui:composition>
