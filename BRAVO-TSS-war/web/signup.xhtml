<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition
    template="/WEB-INF/templates/page-layout.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="http://primefaces.org/ui">
    <ui:param name="pageHeadline" value="${msg.signupPageHeadline}"/>
    <ui:define name="content">
        <h:messages globalOnly="false" showDetail="true" showSummary="false" styleClass="ui-messages"/>
        <h:form id="signupForm" class="form form-horizontal" role="form">
            <div class="field grid align-items-baseline">
                <p:outputLabel for="firstName" value="${msg.signupFirstNameLabel}"
                                styleClass="col-2 ui-required"/>
                <p:inputText id="firstName"
                             value="#{CreatePersonBean.personDto.firstName}"
                             required="true"
                             requiredMessage="#{msg.signupFirstNameRequired}"
                             placeholder="#{msg.signupFirstNamePlaceholder}"
                             styleClass="col-4"/>
            </div>
            <div class="field grid align-items-baseline">
                <p:outputLabel for="lastName" value="${msg.signupLastNameLabel}"
                                styleClass="col-2 ui-required"/>
                <p:inputText id="lastName"
                             value="#{CreatePersonBean.personDto.lastName}"
                             required="true"
                             requiredMessage="#{msg.signupLastNameRequired}"
                             placeholder="#{msg.signupLastNamePlaceholder}"
                             styleClass="col-4"/>
            </div>
            <div class="field grid align-items-baseline">
                <p:outputLabel for="emailAddress" value="${msg.signupEmailLabel}"
                                styleClass="col-2 ui-required"/>
                <p:inputText id="emailAddress"
                             value="#{CreatePersonBean.personDto.emailAddress}"
                             required="true"
                             requiredMessage="#{msg.signupEmailRequired}"
                             placeholder="#{msg.signupEmailPlaceholder}"
                             styleClass="col-4"/>
            </div>
            <div class="field grid align-items-baseline">
                <p:outputLabel for="password" value="${msg.signupPasswordLabel}"
                                styleClass="col-2 ui-required"/>
                <p:password id="password"
                             value="#{CreatePersonBean.personDto.password}"
                             required="true"
                             requiredMessage="#{msg.signupPasswordRequired}"
                             placeholder="#{msg.signupPasswordPlaceholder}"
                             feedback="false"
                             styleClass="col-4"/>
            </div>
            <div class="field grid align-items-baseline">
                <p:selectBooleanCheckbox id="consent"
                                          value="#{CreatePersonBean.personDto.consent}"
                                          required="true"
                                          requiredMessage="#{msg.signupConsentRequired}"
                                          styleClass="col-2"/>
                <p:outputLabel for="consent" value="${msg.signupConsentLabel}" styleClass="col-4"/>
            </div>
            <p:commandButton id="signupButton"
                              value="${msg.signupButtonLabel}"
                              action="#{CreatePersonBean.createPerson}"/>
        </h:form>
        <div class="field grid align-items-baseline">
            <p>
                ${msg.signupLoginPrompt}
                <!-- TODO: confirm the real outcome/filename for your login page -->
                <h:link id="loginLink" outcome="login" value="${msg.signupLoginLinkLabel}" />
            </p>
        </div>
    </ui:define>
</ui:composition>
