<?xml version="1.0" encoding="UTF-8"?>
<ui:composition
        template="/WEB-INF/templates/page-layout.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="jakarta.faces.html"
        xmlns:f="jakarta.faces.core"
        xmlns:ui="jakarta.faces.facelets"
        xmlns:p="http://primefaces.org/ui">
    
    <f:metadata>
        <f:event type="preRenderView" listener="#{loginBean.redirectIfLoggedIn}" />
    </f:metadata>
    
    <ui:define name="pageTitle">
        BRAVO-TSS
    </ui:define>
    
    <ui:define name="pageHeadline">
        #{msg['welcome.title']}
    </ui:define>
    
    <ui:define name="headerActions">
        <ui:include src="/WEB-INF/components/language-selector.xhtml"/>
    </ui:define>
    
    <ui:define name="content">

        <h:outputStylesheet library="css" name="bravo.css"/>

        <section class="card welcome-card">
            <h2>#{msg['welcome.systemName']}</h2>
            <p class="text-muted">
                #{msg['welcome.description']}
            </p>
            <div class="form-actions">
                <p:button
                        value="#{msg['login.submit']}"
                        icon="pi pi-sign-in"
                        outcome="/views/login"/>
                <p:button
                        value="#{msg['signup.title']}"
                        icon="pi pi-user-plus"
                        outcome="/signup"/>
            </div>
        </section>

    </ui:define>
</ui:composition>
