<?xml version="1.0" encoding="UTF-8"?>
<ui:composition
    template="/WEB-INF/templates/page-layout.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:p="http://primefaces.org/ui">

    <f:metadata>
        <f:viewParam name="id" value="#{EditPersonBean.id}" />
        <f:viewAction action="#{EditPersonBean.init}" />
    </f:metadata>

    <ui:param name="pageHeadline" value="#{msg['person.edit']}" />

    <ui:define name="title">
        #{msg['person.edit']}
    </ui:define>

    <ui:define name="content">
        <h:form id="editPersonForm">

            <h:messages globalOnly="true" />

            <p:panelGrid columns="2" layout="grid">

                <p:outputLabel
                    value="#{msg['person.firstName']}"
                    for="firstName" />

                <p:inputText
                    id="firstName"
                    value="#{EditPersonBean.personDto.firstName}"
                    placeholder="#{msg['person.firstName.placeholder']}" />

                <p:outputLabel
                    value="#{msg['person.lastName']}"
                    for="lastName" />

                <p:inputText
                    id="lastName"
                    value="#{EditPersonBean.personDto.lastName}"
                    placeholder="#{msg['person.lastName.placeholder']}" />

                <p:outputLabel
                    value="#{msg['person.email']}"
                    for="email" />

                <p:inputText
                    id="email"
                    value="#{EditPersonBean.personDto.emailAddress}"
                    placeholder="#{msg['person.email.placeholder']}" />

                <p:outputLabel
                    value="#{msg['person.role']}"
                    for="role" />

                <p:selectOneMenu
                    id="role"
                    value="#{EditPersonBean.personDto.role}">

                    <f:selectItem
                        itemLabel="#{msg['role.ADMIN']}"
                        itemValue="ADMIN" />

                    <f:selectItem
                        itemLabel="#{msg['role.ASSISTANT']}"
                        itemValue="ASSISTANT" />

                    <f:selectItem
                        itemLabel="#{msg['role.EMPLOYEE']}"
                        itemValue="EMPLOYEE" />

                    <f:selectItem
                        itemLabel="#{msg['role.SECRETARY']}"
                        itemValue="SECRETARY" />

                    <f:selectItem
                        itemLabel="#{msg['role.SUPERVISOR']}"
                        itemValue="SUPERVISOR" />

                </p:selectOneMenu>

            </p:panelGrid>

            <p:commandButton
                value="#{msg['button.save']}"
                action="#{EditPersonBean.save}" />

            <p:commandButton
                value="#{msg['button.delete']}"
                action="#{EditPersonBean.delete}" />

            <p:commandButton
                value="#{msg['button.cancel']}"
                action="#{EditPersonBean.cancel}"
                immediate="true" />

        </h:form>
    </ui:define>

</ui:composition>
