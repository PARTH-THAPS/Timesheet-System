<?xml version="1.0" encoding="UTF-8"?>
<ui:composition template="/WEB-INF/templates/page-layout.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:ui="jakarta.faces.facelets"
                 xmlns:h="jakarta.faces.html"
                 xmlns:f="jakarta.faces.core"
                 xmlns:p="http://primefaces.org/ui">
    <ui:param name="pageHeadline" value="All Persons"/>
    <ui:define name="title">All Persons</ui:define>
    <ui:define name="content">
        <h:form id="personForm">
            <h:messages globalOnly="true" />
            <p:dataTable id="personTable"
                         var="person"
                         value="#{PersonListBean.persons}"
                         emptyMessage="No persons found."
                         paginator="true"
                         rows="10">
                <p:column headerText="First Name">
                    <h:outputText value="#{person.firstName}" />
                </p:column>
                <p:column headerText="Last Name">
                    <h:outputText value="#{person.lastName}" />
                </p:column>
                <p:column headerText="Email">
                    <h:outputText value="#{person.emailAddress}" />
                </p:column>
                <p:column headerText="Role">
                    <h:outputText value="#{person.role}" />
                </p:column>
                <p:column headerText="Actions">
                    <h:link outcome="EditPerson" value="Edit">
                        <f:param name="id" value="#{person.id}" />
                    </h:link>
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
