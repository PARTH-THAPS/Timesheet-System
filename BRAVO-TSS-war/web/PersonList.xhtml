<?xml version="1.0" encoding="UTF-8"?>

<ui:composition
    template="/WEB-INF/templates/page-layout.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:p="http://primefaces.org/ui">

    <ui:param name="pageHeadline" value="#{msg['person.list']}" />

    <ui:define name="title">
        #{msg['person.list']}
    </ui:define>

    <ui:define name="content">

        <h:form id="personForm">

            <h:messages globalOnly="true" />

            <p:dataTable
                id="personTable"
                var="person"
                value="#{PersonListBean.persons}"
                emptyMessage="#{msg['person.noPersons']}"
                paginator="true"
                rows="10">

                <p:column headerText="#{msg['person.firstName']}">
                    <h:outputText value="#{person.firstName}" />
                </p:column>

                <p:column headerText="#{msg['person.lastName']}">
                    <h:outputText value="#{person.lastName}" />
                </p:column>

                <p:column headerText="#{msg['person.email']}">
                    <h:outputText value="#{person.emailAddress}" />
                </p:column>

                <p:column headerText="#{msg['person.role']}">
                    <ui:repeat value="#{person.role}" var="r">
                        #{msg['role.'.concat(r.name())]} 
                    </ui:repeat>
                </p:column>

                <p:column headerText="#{msg['common.actions']}">
                    <h:link
                        outcome="EditPerson"
                        value="#{msg['button.edit']}">

                        <f:param
                            name="id"
                            value="#{person.id}" />

                    </h:link>
                </p:column>

            </p:dataTable>

        </h:form>

    </ui:define>

</ui:composition>
