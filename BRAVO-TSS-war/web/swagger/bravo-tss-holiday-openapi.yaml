openapi: 3.0.3
info:
  title: BRAVO-TSS Holiday API
  description: |
    REST API for German public holidays per federal state.

    Endpoints:
    - `POST /holiday/create` stores holidays in bulk
    - `GET /holiday/find/{state}` returns all holidays of one state
    - `GET /holiday/find/{state}/range` returns the holidays of one state within a date range
  version: 1.0.0

servers:
  - url: /BRAVO-TSS-war/api/v1
    description: Same host as this documentation page

tags:
  - name: Holiday
    description: Create and find holidays

paths:
  /holiday/create:
    post:
      tags: [Holiday]
      summary: Create holidays in bulk
      description: |
        Stores a list of holidays. Each entry is one holiday for one state,
        so a nationwide holiday is sent once per state.

        The endpoint does not check for duplicates. Sending the same payload
        twice creates the entries twice.
      operationId: createHolidayTable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/HolidayInput'
            example:
              - day: Thursday
                date: "2026-01-01"
                holiday: New Year's Day
                state: NRW
                year: 2026
              - day: Thursday
                date: "2026-06-04"
                holiday: Corpus Christi
                state: NRW
                year: 2026
              - day: Friday
                date: "2026-12-25"
                holiday: Christmas Day
                state: NRW
                year: 2026
      responses:
        '200':
          description: Holidays created. Returns the stored entries with their ids.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Holiday'
              example:
                - id: 1
                  uuid: 3f2b8c1e-5a4d-4e7b-9c1a-2d6f8e9a0b11
                  jpaVersion: 0
                  day: Thursday
                  date: "2026-01-01"
                  holiday: New Year's Day
                  state: NRW
                  year: 2026
        '400':
          description: Invalid JSON, unknown state code or wrong date format
        '500':
          description: Server error while saving

  /holiday/find/{state}:
    get:
      tags: [Holiday]
      summary: Find holidays of one state
      description: Returns all stored holidays for the given federal state.
      operationId: getHolidayByState
      parameters:
        - $ref: '#/components/parameters/State'
      responses:
        '200':
          description: Holidays of the state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Holiday'
              example:
                - id: 1
                  uuid: 3f2b8c1e-5a4d-4e7b-9c1a-2d6f8e9a0b11
                  jpaVersion: 0
                  day: Thursday
                  date: "2026-01-01"
                  holiday: New Year's Day
                  state: NRW
                  year: 2026
        '404':
          description: Unknown state code
        '500':
          description: Server error

  /holiday/find/{state}/range:
    get:
      tags: [Holiday]
      summary: Find holidays of one state within a date range
      description: |
        Returns the holidays of the given state between `startDate` and `endDate`.
        Both query parameters are required and must use the format `yyyy-MM-dd`.
      operationId: getHolidaysByStateAndRange
      parameters:
        - $ref: '#/components/parameters/State'
        - name: startDate
          in: query
          required: true
          description: First day of the range (yyyy-MM-dd)
          schema:
            type: string
            format: date
            example: "2026-01-01"
        - name: endDate
          in: query
          required: true
          description: Last day of the range (yyyy-MM-dd)
          schema:
            type: string
            format: date
            example: "2026-12-31"
      responses:
        '200':
          description: Holidays of the state within the range
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Holiday'
              example:
                - id: 3
                  uuid: 7c1d9e42-8b3f-4a26-a5d0-1e2f3a4b5c6d
                  jpaVersion: 0
                  day: Friday
                  date: "2026-12-25"
                  holiday: Christmas Day
                  state: NRW
                  year: 2026
        '404':
          description: Unknown state code
        '500':
          description: Missing or invalid date (not in yyyy-MM-dd format) or server error

components:
  parameters:
    State:
      name: state
      in: path
      required: true
      description: Short code of the federal state
      schema:
        $ref: '#/components/schemas/FederalState'

  schemas:
    FederalState:
      type: string
      description: Short code of a German federal state
      enum: [BB, BE, BW, BY, HB, HE, HH, MV, NI, NRW, RLP, SH, SL, SN, ST, TH]
      example: NRW

    HolidayInput:
      type: object
      required: [day, date, holiday, state, year]
      properties:
        day:
          type: string
          description: Weekday name in English
          enum: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
          example: Thursday
        date:
          type: string
          format: date
          description: ISO date (yyyy-MM-dd)
          example: "2026-01-01"
        holiday:
          type: string
          example: New Year's Day
        state:
          $ref: '#/components/schemas/FederalState'
        year:
          type: integer
          example: 2026

    Holiday:
      allOf:
        - $ref: '#/components/schemas/HolidayInput'
        - type: object
          properties:
            id:
              type: integer
              format: int64
              readOnly: true
              example: 1
            uuid:
              type: string
              readOnly: true
              example: 3f2b8c1e-5a4d-4e7b-9c1a-2d6f8e9a0b11
            jpaVersion:
              type: integer
              readOnly: true
              example: 0
