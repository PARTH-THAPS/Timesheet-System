<?xml version="1.0" encoding="UTF-8"?>

<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets">

    <nav class="app-navigation">

        <ul class="navigation-list">

            <li>
                <h:link
                    outcome="/views/portal/home"
                    styleClass="navigation-link">

                    <i class="pi pi-home"></i>
                    <span>Home</span>

                </h:link>
            </li>

            <ui:fragment rendered="#{mockUserBean.hasRole('EMPLOYEE')}">

                <li>
                    <h:link
                        outcome="/views/employee/timesheets"
                        styleClass="navigation-link">

                        <i class="pi pi-clock"></i>
                        <span>Timesheets</span>

                    </h:link>
                </li>

            </ui:fragment>

            <ui:fragment
                rendered="#{mockUserBean.hasRole('ASSISTANT')
                            or mockUserBean.hasRole('SUPERVISOR')}">

                <li>
                    <h:link
                        outcome="/views/assistant/contracts"
                        styleClass="navigation-link">

                        <i class="pi pi-file"></i>
                        <span>Contracts</span>

                    </h:link>
                </li>

                <li>
                    <h:link
                        outcome="/views/shared/archive-contracts"
                        styleClass="navigation-link">

                        <i class="pi pi-folder-open"/>
                        <span>Contract Archive</span>

                    </h:link>
                </li>

            </ui:fragment>

            <ui:fragment rendered="#{mockUserBean.hasRole('SUPERVISOR')}">

                <li>
                    <h:link
                        outcome="/views/supervisor/archived-contracts"
                        styleClass="navigation-link">

                        <i class="pi pi-briefcase"/>
                        <span>Supervision Archive</span>

                    </h:link>
                </li>

            </ui:fragment>

            <ui:fragment rendered="#{mockUserBean.hasRole('SECRETARY')}">
                <li>
                    <h:link
                            outcome="/views/secretary/secretary-archive"
                            styleClass="navigation-link">
                        <i class="pi pi-inbox"></i>
                        <span>Pending Archives</span>
                    </h:link>
                </li>
            </ui:fragment>

            <ui:fragment rendered="#{mockUserBean.hasRole('ADMIN')}">

                <li>
                    <h:link
                        outcome="/views/admin/usersmgmt"
                        styleClass="navigation-link">

                        <i class="pi pi-users"></i>
                        <span>Users</span>

                    </h:link>
                </li>


                <li>
                    <h:link
                        outcome="/views/admin/HolidayList"
                        styleClass="navigation-link">
                        <i class="pi pi-address-book"></i>
                        <span>Holiday Management</span>
                    </h:link>
                </li>

            </ui:fragment>

        </ul>

    </nav>

</ui:composition>
