<?xml version="1.0" encoding="UTF-8"?>

<ui:composition
   xmlns="http://www.w3.org/1999/xhtml"
   xmlns:h="jakarta.faces.html"
   xmlns:ui="jakarta.faces.facelets">

   <nav class="app-navigation">

       <ul class="navigation-list">

           <!-- Home -->
           <li>
               <h:link
                   outcome="/views/portal/home"
                   styleClass="navigation-link">

                   <i class="pi pi-home"></i>
                   <span>Home</span>

               </h:link>
           </li>

           <!-- My Profile -->
           <li>
               <h:link
                   outcome="/views/portal/EditInfo"
                   styleClass="navigation-link">

                   <i class="pi pi-users"></i>
                   <span>My Profile</span>

               </h:link>
           </li>

           <!-- Employee -->
           <ui:fragment
               rendered="#{loginBean.hasRole('EMPLOYEE')}">

               <li>
                   <h:link
                       outcome="/views/employee/timesheets"
                       styleClass="navigation-link">

                       <i class="pi pi-clock"></i>
                       <span>Timesheets</span>

                   </h:link>
               </li>

           </ui:fragment>

           <!-- Assistant / Supervisor -->
           <ui:fragment
               rendered="#{loginBean.hasRole('ASSISTANT')
                           or loginBean.hasRole('SUPERVISOR')}">

               <li>
                   <h:link
                       outcome="/views/assistant/contracts"
                       styleClass="navigation-link">

                       <i class="pi pi-file"></i>
                       <span>Contracts</span>

                   </h:link>
               </li>

           </ui:fragment>

           <!-- Admin -->
           <ui:fragment
               rendered="#{loginBean.hasRole('ADMIN')}">

               <!-- User Management -->
               <li>
                   <h:link
                       outcome="/views/admin/usersmgmt"
                       styleClass="navigation-link">

                       <i class="pi pi-users"></i>
                       <span>Users</span>

                   </h:link>
               </li>

               <!-- Holiday Management -->
               <li>
                   <h:link
                       outcome="/views/admin/HolidayList"
                       styleClass="navigation-link">

                       <i class="pi pi-address-book"></i>
                       <span>Holiday Management</span>

                   </h:link>
               </li>

               <!-- Dashboard -->
               <li>
                   <h:link
                       outcome="/views/admin/dashboard"
                       styleClass="navigation-link">

                       <i class="pi pi-chart-bar"></i>
                       <span>Dashboard</span>

                   </h:link>
               </li>

           </ui:fragment>

       </ul>

   </nav>

</ui:composition>
