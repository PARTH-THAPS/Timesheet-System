home.myTimesheets.title=My Timesheets
home.myTimesheets.description=View and manage your working time and timesheets.
home.myTimesheets.dialog=Your timesheet is generated automatically for each pay period. Here you can review your logged working hours, edit entries before they are submitted, and check whether a timesheet has been signed by you and your supervisor.

home.holidays.title=Holidays
home.holidays.description=View holidays and absences.
home.holidays.dialog=View the company holiday calendar and your own recorded absences. This gives you a quick overview of upcoming holidays and how many absence days you have taken or have remaining.

home.timesheetApproval.title=Timesheet Approval
home.timesheetApproval.description=Review and sign submitted timesheets.
home.timesheetApproval.dialog=Review timesheets submitted by the employees under your supervision. You can approve and sign completed timesheets, or flag entries that need correction before they move forward.

home.employees.title=Employees
home.employees.description=Manage employees, contracts and assignments.
home.employees.dialog=Manage employee records, contracts, and task assignments. You can create new contracts, update existing ones, and assign employees to the appropriate supervisors or projects.

home.timesheetArchive.title=Timesheet Archive
home.timesheetArchive.description=Process and archive completed timesheets.
home.timesheetArchive.dialog=Process fully signed timesheets by printing, forwarding, and archiving completed records so they are available for future reference or payroll processing.

home.administration.title=Administration
home.administration.description=Manage users and application settings.
home.administration.dialog=Manage user accounts and roles, configure application-wide settings, and oversee the overall setup of the timesheet system.

